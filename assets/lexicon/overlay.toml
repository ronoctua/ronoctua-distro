# Curated overlay of semantic tags — section 6.5.
#
# The second (and last) file kept by hand. Here go the tags the glyph's NAME
# does not deliver: the floppy disk is also "salvar", the gear is also
# "configuracoes".
#
# The key is the GLYPH NAME, never the codepoint. The name is stable across versions
# of Nerd Fonts; the PUA codepoint is not (section 6.3) — using a codepoint here
# would make the file rot silently on the next update.
#
# These tags ADD to the ones derived from the name; they do not replace them.
#
# It starts small (~50 entries) and grows through use: when an obvious search does not
# find the obvious glyph, the correction comes here.

[fa-floppy_o]
en = ["save", "disk", "storage", "legacy"]
pt = ["salvar", "disquete", "armazenamento"]

[md-content_save]
en = ["save", "floppy", "disk"]
pt = ["salvar", "gravar", "disquete"]

