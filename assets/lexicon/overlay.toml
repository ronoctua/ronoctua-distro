# The Octicons `x` IS the CLOSE symbol, and not the letter x.
#
# It comes through here, and not through the lexicon: translating the token `x` globally would put
# "fechar" on `fa-x_ray` and on every `md-alpha_x`. This file exists for
# exactly that — the tag the glyph's NAME does not deliver.
[oct-x]
en = ["close", "cancel", "dismiss", "remove"]
pt = ["fechar", "cancelar", "dispensar", "sair"]
