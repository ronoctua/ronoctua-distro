# Bilingual glyph tag lexicon — section 6.5.
#
# One of the only TWO files kept by hand (the other is overlay.toml). Everything
# else is generated at build time by ronoctua-glyphgen, from the same source that produces the
# icon token table.
#
# How it works
# ------------
# Nerd Fonts names are compositional: `nf-md-arrow_up_bold` tokenises into
# arrow, up, bold. Tokenising already delivers most of the English tags for
# free. This file maps the recurring tokens to pt-BR.
#
# RULE: a token with no entry here PASSES UNTRANSLATED. Better than a bad
# guess. Brand names (nf-dev-*, nf-linux-*) must never be translated.
#
# How to grow it
# --------------
# Do not translate in whatever order comes. The `coverage.md` generated at build time lists the
# UNTRANSLATED tokens ordered by frequency — that is the work queue.
# Estimate: ~400 entries cover the overwhelming majority of occurrences;
# ~800 is the point of diminishing returns. Milestone 7's goal: >= 90% of
# token occurrences translated.
#
# Format: english_token = ["canonical_translation", "synonym", ...]

