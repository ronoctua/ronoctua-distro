# --- BRANDS, by source set ------------------------------------------------
#
# The NAME is not translated — it is already a tag by itself, and the same in both languages.
# What goes in is the CATEGORY, which is what makes `software livre` find the 100
# distribution logos and `desenvolvimento` find the 324 Devicons ones. Without
# that, those glyphs were only reachable by whoever already knew the exact name.
#
# The category is the SAME for the whole set because that is what the set
# means. Individual refinement (Arch is a distribution, Krita is an image
# editor) comes later, in the thematic sections, and ADDS to this one.

