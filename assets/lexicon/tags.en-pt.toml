# ===========================================================================
# FULL COVERAGE — every glyph reachable in Portuguese
# ===========================================================================
#
# The sections above covered the recurring vocabulary. These cover the REST: a
# third of the 10,473 glyphs did not have a single Portuguese word, and whoever
# searched in Portuguese simply did not find them.
#
# Two rules that hold from here down:
#
#   1. A PROPER NAME IS NOT TRANSLATED — it gets a CATEGORY. `pytorch` stays
#      `pytorch` (it is already a tag by its own name); what goes in is what it IS:
#      machine learning, library, python. Translating a brand produces
#      a wrong search that looks right.
#   2. No guessing. A token whose meaning I did not know was left out and still
#      shows up in coverage.md — a wrong tag is worse than an absent one,
#      because it puts the glyph in a search where it should not be.
#
# The `{ en = [...], pt = [...] }` form adds an ENGLISH SYNONYM; the list
# form, translation only. Both are valid.

# --- A ---------------------------------------------------------------------
