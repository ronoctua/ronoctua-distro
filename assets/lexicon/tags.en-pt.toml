# --- A loose letter and a number: only where they ARE the glyph ------------
#
# `c`, `d`, `f`, `r`, `v` are the names of languages (`seti-c_sharp`,
# `seti-f_sharp`, `dev-r`, `custom-v_lang`). `500px` is a brand. Beyond those,
# a loose letter does NOT become a tag: `md-alpha_u` is already reachable through `alfa`, and filling
# the lexicon one letter at a time would only put noise into every single-letter search.
