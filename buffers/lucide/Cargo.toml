# OWN workspace, like every buffer: a wasip2 component cannot be a member of
# the host workspace — `rust-lld` rejects the component model symbols. See the
# `exclude` in the root `Cargo.toml`.
[workspace]

[package]
name = "ronoctua-buffer-lucide"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
publish = false
description = "Lucide icon browser — a native buffer"

[lib]
crate-type = ["cdylib"]

# SINGLE dependency. Every extra crate goes into the component, and the
# component is instantiated on every buffer open (5 ms budget, section 5.2).
#
# `wit-bindgen` is NOT it any more: `ronoctua-design` owns the `generate!` and
# re-exports the `export!` a component needs, so there is ONE generated binding
# set for the buffers instead of one each. That is what lets a layout function
# be SHARED — while every buffer generated its own types, `lucide`'s `Command`
# and `glyphs`'s `Command` were different Rust types of the same shape, and a
# helper that took one could not be given the other. Which is how three
# browsers came to carry three copies of one grid, with three sets of numbers.
[dependencies]
ronoctua-design = { path = "../../crates/ronoctua-design", default-features = false, features = [
  "guest",
] }

[lints.rust]
unsafe_code = "warn"
missing_docs = "warn"

# The size counts against the instantiation budget.
[profile.release]
opt-level = "s"
lto = true
strip = true
