# OWN workspace, like every buffer: a wasip2 component cannot be a member of
# the host workspace — `rust-lld` rejects the component model symbols. See the
# `exclude` in the root `Cargo.toml`.
[workspace]

[package]
name = "ronoctua-buffer-lucide"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
publish = false
description = "Navegador de icones Lucide — buffer nativo"

[lib]
crate-type = ["cdylib"]

# SINGLE dependency. Every extra crate goes into the component, and the
# component is instantiated on every buffer open (5 ms budget, section 5.2).
[dependencies]
wit-bindgen = { version = "0.46", default-features = false, features = [
  "macros",
] }

[lints.rust]
unsafe_code = "warn"
missing_docs = "warn"

# The size counts against the instantiation budget.
[profile.release]
opt-level = "s"
lto = true
strip = true
