# A workspace of its own, like every buffer: the component is built for
# `wasm32-wasip2`, and as a member of the host's workspace `rust-lld` would
# refuse the version script with an error that mentions wasm nowhere.
[workspace]

[package]
name = "ronoctua-buffer-format"
description = "Formatting a disk: choose the target, choose what it is for, and confirm."
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
# THE LAYOUT VOCABULARY, and the bindings with it.
#
# `wit-bindgen` is NOT a dependency here any more: `ronoctua-design` owns the
# `generate!` and re-exports the `export!` a component needs. That is what makes
# "one heading" a thing the compiler enforces rather than a thing seven files
# agree on — and this buffer is the one that used to draw a rule under its
# title and leave a blank cell after it.
ronoctua-design = { path = "../../crates/ronoctua-design", default-features = false, features = [
  "guest",
] }

[lints.rust]
# The same two as the host's workspace, repeated because this is another
# workspace. There is no `allow` for generated code any more: the bindings live
# in `ronoctua-design`, and so does the exemption they need.
unsafe_code = "warn"
missing_docs = "warn"

[profile.release]
opt-level = "s"
lto = true
strip = true
