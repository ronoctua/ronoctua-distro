# OWN workspace: this crate only exists for `wasm32-wasip2`. See the comment
# on the `exclude` in the root Cargo.toml.
[workspace]

[package]
name = "ronoctua-buffer-example"
description = "A minimal native buffer, to prove milestone 7's boundary."
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "MIT"
publish = false

[lib]
# `cdylib` is what `wasm32-wasip2` needs in order to become a component.
crate-type = [ "cdylib" ]

[dependencies]
# THE LAYOUT VOCABULARY, and the bindings with it.
#
# `wit-bindgen` is NOT a dependency here any more: `ronoctua-design` owns the
# `generate!` and re-exports the `export!` macro, so there is ONE generated
# binding set for the seven buffers instead of seven. That is what makes "one
# heading" enforceable rather than agreed.
ronoctua-design = { path = "../../crates/ronoctua-design", default-features = false, features = [
  "guest",
] }

[lints.rust]
# The same ones as the host's workspace, repeated because this is another
# workspace. The `allow` for the generated code is in `lib.rs` itself, with the reason.
unsafe_code = "warn"
missing_docs = "warn"

[profile.release]
# A small component instantiates fast: the size counts towards the
# deserialization time of the `.cwasm` (section 5.2).
opt-level = "s"
lto = true
strip = true
