# OWN workspace: it only exists for `wasm32-wasip2`. See the `exclude` at the root.
[workspace]

[package]
name = "ronoctua-buffer-glyphs"
description = "Glyph browser (section 6.5)."
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "MIT"
publish = false

[lib]
crate-type = [ "cdylib" ]

[dependencies]
# THE LAYOUT VOCABULARY, and the bindings with it.
#
# `wit-bindgen` is NOT a dependency here any more: `ronoctua-design` owns the
# `generate!` and re-exports the `export!` macro, so the three browsers share
# ONE generated binding set — and, with it, one grid, one sheet and one
# heading. Three copies of the same geometry with three different constants is
# what this dependency replaces.
ronoctua-design = { path = "../../crates/ronoctua-design", default-features = false, features = [
  "guest",
] }

[lints.rust]
unsafe_code = "warn"
missing_docs = "warn"

[profile.release]
opt-level = "s"
lto = true
strip = true
