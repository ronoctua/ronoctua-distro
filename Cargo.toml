]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "MIT"
publish = false

[workspace.dependencies]
# --- Wayland -----------------------------------------------------------
# Integration with the compositor is through IPC and wlr-layer-shell (invariant
# 3), plus the standard protocols the owner approved one by one: the data
# device, screen capture, the virtual keyboard below, and the virtual pointer
# (`zwlr_virtual_pointer_v1`, from `wayland-protocols-wlr`: the hand gestures'
# one door, `ronoctua-shell-footer/src/virtual_pointer.rs`).
# The `system` feature swaps the pure-Rust backend for the libwayland one (FFI).
# It is NOT optional: only it exposes `display_ptr` and `as_ptr`, the C pointers
# wgpu needs to create the Surface. With the default backend those
# pointers do not exist — there is no C underneath at all.
smithay-client-toolkit = { version = "0.21", features = [ "system" ] }
wayland-client = { version = "0.31", features = [ "system" ] }
wayland-protocols-wlr = "0.3"
# THE VIRTUAL KEYBOARD, and nothing else from this crate: the on-screen
# keyboard's one door (`ronoctua-shell-footer/src/virtual_keys.rs`). Already in the
# lock through the toolkit; named here so the shell can bind the manager.
wayland-protocols-misc = { version = "0.3", features = [ "client" ] }
raw-window-handle = "0.6"

# --- renderer (section 7.7: wgpu + cosmic-text + glyphon, NO vello) -----
# The workload is glyphs, rectangles and one-line rules. UI icons are glyphs
# (6.3), so there is no vector pipeline that would justify vello.
#
# glyphon 0.12 requires wgpu ^30 and cosmic-text ^0.19 — the three versions move
# together and one cannot be bumped on its own.
wgpu = "30.0"
glyphon = "0.12"
cosmic-text = "0.19"
# The script of a codepoint, so the fallback chain can name one. It is NOT a
# new dependency in the tree: `cosmic-text` already brings it, and the version
# is pinned to the same so the `Script` in our table is the `Script` in its
# trait — two copies of that enum would not even compile together.
unicode-script = "0.5"

# --- the compositor (invariant 3: IPC and layer-shell only) ------------
# There is no dependency here, and that is the point: the types are OURS, in
# `ronoctua-compositor`, and the one crate that speaks a wire protocol
# (`ronoctua-scroll`) writes it by hand out of `serde_json`. A published
# client crate would put a third party between us and the contract test.
# The QR code of the copied content. Just the MATRIX: what draws it is the quad
# pipeline the footer already has — one quad per module. No image, no font, no
# new pipeline.
qrcode = { version = "0.14", default-features = false }

# THE RASTER DECODERS. `png` and `jpeg` are what comes out of a screenshot and
# out of a browser, and for a long time they were the whole list: the clipboard
# is the only thing that decoded, and nobody pastes a TIFF.
#
# `gif`, `webp`, `bmp` and `tiff` joined when the file manager grew a preview,
# and the argument that kept them out no longer holds. They are a few hundred
# kilobytes of BINARY and **zero** store paths — nothing here shells out, and
# nothing here is a new closure — while the formats are what a person actually
# has on disk: the web saves webp, a phone saves gif, a scanner saves tiff.
#
# What is deliberately NOT here is `avif-native`, which is dav1d — a C library,
# and therefore a store path. AVIF, HEIC, RAW and video go to ffmpeg, which is
# installed anyway and reads all four; see `ronoctua_inspect::pixels`.
image = { version = "0.25", default-features = false, features = [
  "png", "jpeg", "gif", "webp", "bmp", "tiff",
] }

# THE SVG RASTERISER for the pixmap step of section 4.2's icon chain.
#
# There is no choice: the superpackage is **335,031 SVGs against 53 PNGs**. Without it, the
# pixmap step would reach half a percent of what exists, and the owner decided to
# pay the cost — the list never waits for it, and the icon arrives afterwards.
#
# `default-features = false` leaves out the TEXT engine (fontdb, rustybuzz
# and system font lookup): an application icon has no text, and the
# renderer already embeds its faces by Nix path (section 6.4) — a
# second font machinery searching the system would be the boundary that
# invariant exists to avoid.
resvg = { version = "0.48", default-features = false }

serde = { version = "1", features = [ "derive" ] }
serde_json = "1"

# --- WASM runtime (sections 5.2, 7.8 and 7.9) -------------------------
# `memory_init_cow` and `pooling-allocator` are NOT optional optimisations: without
# them the glyphdb's ~1.5 MB become a memcpy per instance and blow the 5 ms
# budget on their own. See the trap in AGENTS.md.
#
# 40 AND NOT LESS: up to 39 wasmtime sized the tag of an enum or variant with
# EXACTLY 256 cases as two bytes, where the canonical ABI — and the
# `wit-bindgen` that builds every buffer — gives it one (wasmtime #12066). The
# `icon` token enum reached 256, and every buffer's `render` came back as
# `discriminant N out of range`: the host read one icon plus the next byte as
# a single tag. From 40 the two sides size a tag by the same rule.
wasmtime = { version = "40", default-features = false, features = [
  "runtime", "component-model", "cranelift", "pooling-allocator", "std",
] }
wit-bindgen = { version = "0.46", default-features = false, features = [ "macros" ] }
# A `wasm32-wasip2` component with `std` IMPORTS wasi:io, wasi:cli and the like —
# there is no way not to import them. The host has to offer them, otherwise instantiation
# fails with "matching implementation was not found in the linker".
#
# WASI does not loosen invariant 11: it gives no Wayland, no token and no
# translation. It gives a clock, randomness and stdio, which is the target's floor.
wasmtime-wasi = "40"

# --- terminal (section 7.10, risk R1) ---------------------------------
# `alacritty_terminal` is the implementation milestone 7 closes with. The
# `libghostty-vt` comes in later behind the SAME trait — and it is the trait that makes the
# order irrelevant, which is R1's recorded mitigation.
alacritty_terminal = "0.26"
# The PTY. `rustix` and not `libc`/`nix` because its API is SAFE: the terminal
# crate is `forbid(unsafe_code)`, and opening a pty with libc would require `unsafe`
# in four calls. It is already in the tree underneath wasmtime — as a
# direct dependency it brings nothing new.
rustix = { version = "1.1", features = [ "pty", "termios", "process", "stdio", "fs" ] }
# A STOP HANDLER that a `forbid(unsafe_code)` daemon can install: the
# transfer queue's `SIGTERM` unwinds its copies before it exits. Already in the
# lock (`alacritty_terminal` pulls the same version), so nothing new is fetched.
signal-hook = "0.4"

# --- D-Bus: notifications and tray ------------------------------------
# zbus's BLOCKING API (`blocking-api`), on a thread of its own.
#
# It is a SHELL over the async one — `async-io` gets into the closure either
# way, and turning the default features off only breaks the build. What one gains is
# that OUR code does not become async: the shell is a calloop loop with one thread
# per event source, and a second concurrency model inside it
# would cost more than the thread it already has.
zbus = { version = "5", features = [ "blocking-api" ] }
# THE PAIRING AGENT'S THREE, and only its. bluetoothd asks a question and
# waits sixty seconds for the answer; the handler that waits has to park a
# TASK and not the connection's executor, or the same connection's own calls
# — `CancelPairing` among them — would be stuck behind the question. All
# three are already under zbus in the lock, so nothing new is fetched.
futures-channel = "0.3"
futures-lite = "2"
async-io = "2"

# --- i18n (section 22 of the summary: Fluent, not gettext) -------------
# Plural, gender and argument order belong to the LANGUAGE. In Fluent those rules
# live in the `.ftl`, where the translator works; in gettext they would become `ngettext` with
# a numeric rule inside the Rust.
fluent-bundle = "0.16"
unic-langid = "0.9"

# --- utilities ---------------------------------------------------------
anyhow = "1"
# Reinterpreting a `struct` as bytes for wgpu's instance buffer.
# It is already in the tree underneath wgpu; as a direct dependency it brings nothing
# new, and it avoids a transmute `unsafe` in `ronoctua-render`.
bytemuck = { version = "1", features = [ "derive" ] }
pollster = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# --- TLS, and the cryptography the WebSocket handshake needs -----------
# All four were ALREADY in the lock, underneath the world clock's rustls.
# Naming them here is what lets `ronoctua-http` own the transport instead of
# `ronoctua-world` owning a private copy of it: two TLS stacks in one workspace
# is the defect `one-http-writer` exists to refuse, one layer up.
#
# `aws-lc-rs` and not `ring`, since 2026-10-05: `ring` has no ML-KEM, so a
# connection through it could only ever agree a CLASSICAL key — one a record
# taken today gives up to whoever has a quantum computer later. With
# `prefer-post-quantum` the hello offers `X25519MLKEM768` first and X25519
# beside it: a host that knows the hybrid gets it, and one that does not is
# still reached (`tls-is-post-quantum-first`). The fear that kept `ring` —
# cmake and a Go toolchain in the build — belonged to an older `aws-lc-sys`;
# the one pinned builds with `cc` and its pregenerated bindings.
#
# ONE PROVIDER of the primitives this tree calls itself: the WebSocket's
# SHA-1, ClipCascade's PBKDF2, every SHA-256 and the F-Droid index's RSA
# signature come from `aws-lc-rs` too (declared under the wave's anchor
# below), and `one-crypto-implementation` refuses `ring` coming back. Two
# stay apart because no provider has what they need: `age` brings its own
# RustCrypto for the age format, and ClipCascade's GCM takes a SIXTEEN-byte
# nonce (`aes-gcm`, see `crates/ronoctua-clipcascade/Cargo.toml`).
rustls = { version = "0.23", default-features = false, features = [ "aws_lc_rs", "prefer-post-quantum", "std", "tls12", "logging" ] }
rustls-pki-types = "1"
rustls-pemfile = "2"
base64 = "0.22"

# --- the 2026-09-30 wave: search, arithmetic, catalogues, belongings ----
# Approved with the plan. Every one is PURE RUST except `rusqlite`, which links
# the system `libsqlite3` (never `bundled`: no C build of our own, and the
# store's SQLite is the one FTS5 is measured against).
#
# THE HEAVY THREE ARE OPTIONAL in the crates that use them — `tantivy` behind
# `ronoctua-index/engine`, `rusqlite` behind `ronoctua-video-metrics/db`,
# `age` behind `ronoctua-belongings/crypt` — and off by default, so the
# workspace does not compile them until the lane that needs one turns it on.
# They are in `Cargo.lock` anyway: the lock is resolved with every feature of
# every member, which is what lets it change ONCE, here.

# THE SUPER INDEX (fast-access). An FST term dictionary (prefix and
# Levenshtein), immutable mmapped segments, one writer and many reading
# processes with no server. `mmap` for the segments, `lz4-compression` for the
# stored fields; no stemmer, no stop words, no zstd — names are not prose.
tantivy = { version = "0.26.2", default-features = false, features = [ "mmap", "lz4-compression" ] }
# THE CATALOGUES (the player's channels, video-metrics). FTS5 comes from the
# system library. No default features: they add a wasm-only backend to the
# lock; `cache` is `prepare_cached`.
rusqlite = { version = "0.40.2", default-features = false, features = [ "cache" ] }
# THE CALCULATOR'S EXACT ARITHMETIC: `BigRational` for + − × ÷ and integer
# powers; only a transcendental becomes an approximation. `num-rational` 0.4
# is built on `num-bigint` 0.4 — the 0.5 line would be a second `BigInt`.
num-bigint = "0.4.6"
num-rational = { version = "0.4.2", default-features = false, features = [ "num-bigint", "std" ] }
num-traits = "0.2.19"
# THE BELONGINGS' ENCRYPTION: X25519 recipients and one scrypt passphrase
# (`key.age`), recoverable with the `age` CLI and no distro. No default
# features: no armour, no plugins, no SSH keys.
age = { version = "0.12.1", default-features = false }
# A secret wiped from memory when it is dropped (`ronoctua_consent::keys::Secret`).
# Already in the lock, underneath the TLS stack.
zeroize = "1.9.0"

# --- the 2026-10-05 wave: one region per package, after its anchor -----
# ── anchor: L01 ──
# ── anchor: L02 ──
# THE PRIMITIVES OUR OWN CODE CALLS — digests, PBKDF2, randomness, the RSA
# check of an F-Droid index — from the same library rustls agrees its keys
# with (see the TLS section above). No default features: `ring-io` and
# `ring-sig-verify` are shims for code written against `ring`'s `untrusted`
# inputs, and nothing here is.
aws-lc-rs = { version = "1.18", default-features = false, features = [ "aws-lc-sys", "alloc" ] }
# ── anchor: L07 ──
# THE LENIENT STORES (`ronoctua-store`): WHERE a value failed to read
# (`serde_path_to_error`) and WHICH keys a type passed over (`serde_ignored`),
# so a broken field costs that field and a newer machine's field survives an
# older machine's write. The repair ledger names the file it judged by its
# SHA-256 (`sha2`, already in the lock under `age`).
serde_path_to_error = "0.1.20"
serde_ignored = "0.1.14"
sha2 = "0.10.9"
# ── anchor: L08 ──
# THE BELONGINGS' CHUNKS: FastCDC (v2020, content-defined), so no repository
# file reaches GitHub's limit and an edit moves few chunks. No default
# features: the async readers would bring tokio for a synchronous engine.
fastcdc = { version = "3.2.1", default-features = false }
# ── anchor: L10 ──
# THE BELONGINGS' IDENTITY KEPT FOR THE SESSION, in the kernel's keyring
# (`@u`, a `user` key with a timeout): the `keyctl` and `add_key` system calls
# behind a safe interface, so `ronoctua-belongings` keeps forbidding
# `unsafe`. No default features: `std` only brings `bitflags/std`.
linux-keyutils = { version = "0.2.5", default-features = false }
# ── anchor: L13 ──
# ── anchor: L14 ──
# THE CODEX LOGS THAT COME COMPRESSED (`rollout-….jsonl.zst`), read by a zstd
# decoder in Rust: no C library and no store path in the LLM CLI's closure.
# `std` only — no checksum hashing (a damaged frame loses its own lines, and
# a count is all that is read out of it).
ruzstd = { version = "0.9", default-features = false, features = [ "std" ] }
# ── anchor: L17 ──
# ── anchor: L22 ──

[workspace.metadata.ronoctua]
# THE FEATURES EVERY BUILD TURNS ON — the plan, both third-party layers and
# every unit of `nix/rust/units.nix`, and the crane leaves of `nix/rust.nix`.
#
# `ronoctua-software`'s `[[bin]]` requires `net` and `draw`, and a workspace
# build compiles a target only when some member ENABLES its required
# features — so without them the software CLI simply is not built, and
# nothing says so until something looks for it. On every command and not
# only the release build: the layers then build `image` with the ICO decoder
# the CLI links (one layer, not a second compilation of it), and the tests
# and clippy reach the code the CLI ships instead of skipping the half of the
# crate behind the two features. The video-metrics scanner's `net` for the
# same reason: its binary requires it, and without it the tests and clippy
# stop at the catalogue and never reach the scanner.
#
# The ORDER is the command line's: crane's leaves still pass these, joined,
# and the string is part of their derivations.
build-features = [
  "ronoctua-software/net",
  "ronoctua-software/draw",
  "ronoctua-video-metrics/net",
]

[workspace.lints.rust]
unsafe_code = "warn"
missing_docs = "warn"

[workspace.lints.clippy]
# Section 5.2 puts "no allocation on the hot path" as a requirement. These
# lints do not prove that, but they catch the obvious before the benchmark.
needless_collect = "warn"
redundant_clone = "warn"

# THE PROFILE OF EVERY LOCAL `cargo` — never of Nix.
#
# `cargo test -p`, `cargo clippy`, rust-analyzer and the devshell build at
# `dev`; every derivation in `nix/rust.nix` names `release` or `loop`, so
# nothing here reaches a store path. What it decides is how much of the disk a
# day of `cargo test` takes.
#
# Full debug info was the default, and it was most of the build: one test
# binary of `ronoctua-shell` measured 716 MiB, 631 of them `.debug_*`; with
# this it is 134 MiB. `line-tables-only` keeps what a panic's backtrace prints
# — file and line of OUR frames — and drops the types and locals a debugger
# would read; a session that wants those says `CARGO_PROFILE_DEV_DEBUG=true`
# for that one run.
#
# The dependencies get none: their frames are not what anybody here debugs,
# and they are hundreds of crates against our sixty. `test` inherits all of
# it, overrides included, so it has no section of its own.
#
# And no `split-debuginfo`: with line tables only, what is left is mostly
# `.debug_line`, which split DWARF keeps in the binary anyway — `.dwo` files
# would add a way to fail without a saving to show for it.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# THE RELEASE PROFILE, CHOSEN BY MEASUREMENT: variant E of
# `nix/rust/profile-variants.nix` (`nix run .#profile-bench`, 2026-10-12).
# Thin LTO and one codegen unit per crate, as before, except the shell's own
# crate, which gets sixteen.
#
# The design fixed the rule before any number: every median of `.#bench`
# within 3% and every p99 within 5% of the old profile's (variant A), every
# budget passing, five interleaved rounds; among those that pass, the
# cheapest edited line wins. The lane added four readings the design did not
# spell out (`nix/scripts/profile-bench.py`), and one of them, added after
# E's numbers were in, decides: a number measured with A's very program (the
# same derivation, so the same file) is noise and is not judged. Without it
# E fails on two p99s of binaries it shares with A byte for byte — the
# component bench, 0.011 against 0.009 ms (A itself went from 0.008 to 0.016
# ms between rounds), and the index's one-letter queries, 1.10×.
#
# Dropping LTO (B, C) slowed the fast-access index by 12–19% and the
# leader's p99 by 30–36%: cross-crate inlining is worth it. Sixteen units in
# EVERY crate (D) slowed a third-party font path by 9–10% in every round.
# Sixteen in the shell alone (E) moves only the shell's own two programs:
# its frame numbers moved inside the tolerance (first frame p99 1.033×,
# leader p99 1.015×), and one line under the shell — the edit everything
# pays, since the shell is above nearly every crate — reaches a release
# shell in 387 s instead of 510 s at two cores, with a peak of 3.9 GiB
# instead of 5.1 (thin LTO splits its work by module, and the shell was one
# 178-thousand-line module on one thread). The price, which the rule reports
# and does not judge: the shell's binary is 10% bigger (147.5 MB against
# 133.7 MB) on every machine and in the ISO, and `ronoctua-render-png` 0.4%.
# The numbers are in docs/ARCHITECTURE.md.
#
# `release-profile-is-the-measured-one` holds this table and the override
# below to the variant `chosen` in `nix/rust/profile-variants.nix`: changing
# either is measuring again.
[profile.release]
lto = "thin"
codegen-units = 1
# NO `debug`. It was `debug = 1`, "to diagnose a missed frame target", and it
# never reached anybody: stdenv's fixup runs `strip -S` over `bin/` (the log of
# every workspace build says so, and `.debug_*` is absent from the installed
# binaries), so the only thing it bought was a bigger dependency layer and a
# slower LTO link. The symbol table survives the strip — `-S` removes debug
# sections, not `.symtab` — so `perf` still names functions.

[profile.release.package.ronoctua-shell]
codegen-units = 16

# THE LOOP'S PROFILE — never the one that is installed.
#
# # What it is for
#
# `release` above is tuned for the binary somebody RUNS for months: `lto` walks
# the whole program at link time and `codegen-units = 1` gives LLVM one unit per
# crate to optimise as a whole. Both trade build time for run time, and both are
# right for the ISO.
#
# They are wrong for the nested loop, which exists to LOOK at the interface and
# is the most-run command in the project. Thin LTO optimises the whole program
# again at every link, and rustc has no incremental thin LTO; one codegen unit
# gave the shell's 178 thousand lines a single thread — measured on this
# machine, eleven of twelve cores idle, and one edited line cost 148 seconds.
# (`release` itself now splits the shell, by measurement: above.)
#
# # Why the FAST side is the one with a name
#
# Because forgetting has to fall the safe way. Named like this, anything that
# does not ask for `loop` gets `release` — slow to build, correct to ship. The
# other arrangement (a cheap `release` and a `dist` profile for delivery) makes a
# forgotten call site put an unoptimised binary on the ISO, with no symptom but
# a machine that is quietly slower. `tests/slow.nix` made the same choice for the
# same reason, from the other end.
#
# # The price
#
# A dependency layer per profile: the 483 third-party crates built for `release`
# cannot be reused for `loop`, so the first build after this pays a fresh
# `buildDepsOnly` — and `$CARGO_TARGET_DIR` grows a second directory.
[profile.loop]
inherits = "release"
# Fast enough to judge a frame; the two settings above are what cost the minutes.
opt-level = 2
codegen-units = 16
lto = false
# No `debug` here either: it inherits `release`'s, which is none.
