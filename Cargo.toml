[workspace]
resolver = "3"

# `buffers/` stays OUTSIDE, and not for tidiness.
#
# A `wasm32-wasip2` component exports symbols with the world's name inside
# (`ronoctua:buffer/view@0.1.0#render`). If it were a member of this workspace,
# cargo would try to compile it for the host too, and `rust-lld` rejects the
# version script: `:` and `/` are not valid there. The error talks about
# "; expected, but got :" and mentions wasm nowhere.
#
# Each buffer is a workspace of its own, with its own lock: a different target,
# a different dependency set.
exclude = [ "buffers" ]
members = [
  "crates/ronoctua-tokens",
  "crates/ronoctua-xdg",
  "crates/ronoctua-cache-sweep",
  "crates/ronoctua-store",
  "crates/ronoctua-http",
  "crates/ronoctua-options",
  "crates/ronoctua-clipcascade",
  "crates/ronoctua-atuin",
  "crates/ronoctua-syntax",
  "crates/ronoctua-atlas",
  "crates/ronoctua-zip",
  "crates/ronoctua-atlas-packs",
  "crates/ronoctua-protocol",
  "crates/ronoctua-design",
  "crates/ronoctua-runtime",
  "crates/ronoctua-cmd",
  "crates/ronoctua-i18n",
  "crates/ronoctua-installer",
  "crates/ronoctua-vt",
  "crates/ronoctua-notify",
  "crates/ronoctua-clipboard",
