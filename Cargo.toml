  "crates/ronoctua-shell-calc",
  "crates/ronoctua-shell-fast-access",
  "crates/ronoctua-shell-icons",
  "crates/ronoctua-shell-software",
  # THE SHELL'S FEATURES, one crate each (the 2026-10-12 wave): a view, its
