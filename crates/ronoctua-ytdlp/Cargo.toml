[package]
name = "ronoctua-ytdlp"
description = "Every yt-dlp command line this system runs: where the program is, the device-level flags, a playlist listed flat and a search for lives."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# THE JSON, and nothing else. yt-dlp answers `--dump-single-json` with one
# document, and the two readers here (`flat`, `lives`) take the few fields they
# use out of it. Both crates were already in every program that links this one:
# the transfer queue and the player daemon.
[dependencies]
serde.workspace = true
serde_json.workspace = true
# A SEARCH OF YOUTUBE takes the person's pass for the host yt-dlp asks
# (`search::SEARCH_HOST`): nothing is started for a host nobody let.
ronoctua-consent = { path = "../ronoctua-consent" }
# Where the words of a search may be cut: between grapheme clusters, the
# tree's one rule (`ronoctua_protocol::cells_of`).
ronoctua-protocol = { path = "../ronoctua-protocol" }
# THE MINTER IS A PART, arriving after the installation: whether it is here
# is asked before every use (`ronoctua_parts::here`). The library alone —
# its root realizer stays out.
ronoctua-parts = { path = "../ronoctua-parts", default-features = false }

# A test mints its passes from a consent file of its own; the helpers that
# read one are `test-support`, never a product's.
[dev-dependencies]
ronoctua-consent = { path = "../ronoctua-consent", features = [ "test-support" ] }

[lints]
workspace = true

[package.metadata.ronoctua]
# What this crate reads and what its programs are: `nix/rust/units.nix`.
