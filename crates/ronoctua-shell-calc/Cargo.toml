[package]
name = "ronoctua-shell-calc"
description = "The calculator's view (`LEADER =`): its lines, keypad and converter, its window and its footer region."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# THE CALCULATOR (the 2026-10-12 wave): the view both doors draw, its window,
# its region of the footer and the one errand handler the two share. On the
# kit and the door only — a line of it recompiles this crate, the search that
# reads its answers (fast-access) and the binary.
[dependencies]
ronoctua-shell-kit = { path = "../ronoctua-shell-kit" }
ronoctua-shell-door = { path = "../ronoctua-shell-door" }

ronoctua-tokens = { path = "../ronoctua-tokens" }
ronoctua-render = { path = "../ronoctua-render" }
ronoctua-compositor = { path = "../ronoctua-compositor" }
# The calculator's engine.
ronoctua-calc = { path = "../ronoctua-calc" }
# The person's consent for the rates' host.
ronoctua-consent = { path = "../ronoctua-consent" }
ronoctua-cmd = { path = "../ronoctua-cmd" }
ronoctua-keymap = { path = "../ronoctua-keymap" }
ronoctua-i18n = { path = "../ronoctua-i18n" }
ronoctua-design = { path = "../ronoctua-design" }
ronoctua-store = { path = "../ronoctua-store" }
ronoctua-files = { path = "../ronoctua-files" }

smithay-client-toolkit.workspace = true
anyhow.workspace = true
serde.workspace = true
tracing.workspace = true

[dev-dependencies]
# The door's and the kit's guards hold in these tests too (`test-support`).
ronoctua-shell-door = { path = "../ronoctua-shell-door", features = [ "test-support" ] }

[lints]
workspace = true

[package.metadata.ronoctua]
# What this crate reads and what its programs are: `nix/rust/units.nix`.
env = ["RONOCTUA_KEYS_DIR"]
# Where other zones are read from, by the door that opens the calculator.
run-env = ["RONOCTUA_ZONEINFO"]
