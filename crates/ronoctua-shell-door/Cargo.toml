[package]
name = "ronoctua-shell-door"
description = "Every window's plumbing, once: the Door, the column, the clipboard, the carry, the picker, launching, the sudo gate, the queue heard."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# THE DOOR (the 2026-10-12 wave): what makes a window a window — registry,
# seats, keyboards and their repeat, pointers, touch, scale, GPU, the watches,
# header, list and bar — and what every window hands a gesture to: the
# clipboard, the drag (`carry.rs`, the one file that speaks `wl_data_device`),
# launching a program, a root gesture through the footer (`sudo::Gate`), the
# queue heard, the brain's socket, the photograph's harness. It stands on the
# kit alone and names no feature and not the footer: a window is a `Content`
# a feature writes, and the door is the same for all of them.
[dependencies]
ronoctua-shell-kit = { path = "../ronoctua-shell-kit" }

ronoctua-tokens = { path = "../ronoctua-tokens" }
ronoctua-xdg = { path = "../ronoctua-xdg" }
ronoctua-render = { path = "../ronoctua-render" }
ronoctua-compositor = { path = "../ronoctua-compositor" }
ronoctua-keymap = { path = "../ronoctua-keymap" }
ronoctua-i18n = { path = "../ronoctua-i18n" }
ronoctua-notify = { path = "../ronoctua-notify" }
ronoctua-apps = { path = "../ronoctua-apps" }
ronoctua-clipboard = { path = "../ronoctua-clipboard" }
# The clipboard's sync (`clipboard_wire`): the footer's history is what syncs.
ronoctua-clipcascade = { path = "../ronoctua-clipcascade" }
ronoctua-protocol = { path = "../ronoctua-protocol" }
ronoctua-design = { path = "../ronoctua-design" }
ronoctua-store = { path = "../ronoctua-store" }
ronoctua-files = { path = "../ronoctua-files" }
# The file picker's sidebar holds the drives.
ronoctua-disks = { path = "../ronoctua-disks" }
ronoctua-display = { path = "../ronoctua-display" }
ronoctua-brain = { path = "../ronoctua-brain" }
ronoctua-transfers = { path = "../ronoctua-transfers" }
ronoctua-private = { path = "../ronoctua-private" }
# The verbs a root gesture names (`sudo`), without the sudo door itself:
# `authority` is the shell binary's alone (`sudo-door-is-one`).
ronoctua-security = { path = "../ronoctua-security" }

smithay-client-toolkit.workspace = true
wayland-client.workspace = true
# THE WINDOW HANDLES wgpu takes a door's surface by (`door/mod.rs`, its one
# `unsafe` block).
raw-window-handle.workspace = true
wayland-protocols-wlr.workspace = true
wgpu.workspace = true
rustix = { workspace = true, features = [ "event", "process" ] }
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
base64.workspace = true
tracing.workspace = true

[dev-dependencies]
# The kit's guards hold in these tests too (its `test-support`).
ronoctua-shell-kit = { path = "../ronoctua-shell-kit", features = [ "test-support" ] }

[features]
# WHAT THIS CRATE KEEPS FOR TESTS, kept for every crate's tests — for
# `[dev-dependencies]` only, as the kit's: a window's tests build its door
# detached (`Ui::for_tests`), a view's tests hand a root gesture to a fake
# gate (`sudo::Gate::fake`), and a test picks nothing the person remembers.
# It brings the kit's along, so a crate that names the door for its tests has
# the machine's guards whatever it reaches through the door.
test-support = [ "ronoctua-shell-kit/test-support" ]

[lints]
workspace = true

[package.metadata.ronoctua]
# What this crate reads and what its programs are: `nix/rust/units.nix`.
env = ["RONOCTUA_KEYS_DIR", "RONOCTUA_SYSTEMCTL", "RONOCTUA_WL_COPY_PATH", "RONOCTUA_WL_PASTE"]
