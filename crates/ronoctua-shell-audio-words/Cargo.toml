[package]
name = "ronoctua-shell-audio-words"
description = "PipeWire as the shell says it: the sentence for each refusal of an order, in the sound view's doors and the footer's volume keys."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# PIPEWIRE'S REFUSALS IN WORDS (the 2026-10-12 wave): the sound view's two
# doors and the footer's volume keys say the same sentence for one refusal,
# so it stands under both — and on no other shell crate. A leaf of its own,
# and not a module of the kit, because the sound crate is a boundary whose
# library changes with what it asks PipeWire (and bakes in the store paths of
# `pw-dump`, `pw-cat` and `wpctl` and the table of `assets/audio-names.nix`):
# under the kit, a line of it would recompile every shell crate; here, it
# recompiles this, the sound view and the binary.
[dependencies]
ronoctua-i18n = { path = "../ronoctua-i18n" }
ronoctua-audio = { path = "../ronoctua-audio" }

[lints]
workspace = true

[package.metadata.ronoctua]
# What this crate reads and what its programs are: `nix/rust/units.nix`.
env = ["RONOCTUA_KEYS_DIR"]
