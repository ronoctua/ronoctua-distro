[package]
name = "ronoctua-render-png"
description = "Draws a buffer into a PNG with no compositor and no VM, through the shell's own paint."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# THE PNG CAMERA OF A BUFFER, a package of its own (the 2026-10-12 wave). It
# was a second `[[bin]]` of the shell that pulled three of the shell's files
# in by `#[path]` (`paint.rs`, `mind_wire.rs`, `sizes.rs`), so its sources
# were another crate's, and every edit of the footer relinked it. Now it
# links them from the kit, the one place they are compiled, and nothing of
# the door or the footer.
[[bin]]
# It draws a buffer into a PNG with no compositor and no VM. It is a binary, and
# not a `#[test]`, for the same reason the drivers are: what it produces is a
# FILE somebody looks at, and the thing it loads is a wasip2 component.
#
# `src/bin/` and not `src/main.rs`: the checks find a shell file by its path
# inside a shell crate's `src/` (`shell_name`), and this one was, and is,
# `bin/render-png.rs` — a `main.rs` would be a second one beside the shell's.
name = "ronoctua-render-png"
path = "src/bin/render-png.rs"

[dependencies]
# `paint`, `mind_wire` and `sizes`: the host's own arithmetic, so a picture
# is what a window draws.
ronoctua-shell-kit = { path = "../ronoctua-shell-kit" }

ronoctua-tokens = { path = "../ronoctua-tokens" }
ronoctua-i18n = { path = "../ronoctua-i18n" }
ronoctua-render = { path = "../ronoctua-render" }
ronoctua-protocol = { path = "../ronoctua-protocol" }
ronoctua-design = { path = "../ronoctua-design" }
ronoctua-runtime = { path = "../ronoctua-runtime" }
ronoctua-brain = { path = "../ronoctua-brain" }
ronoctua-files = { path = "../ronoctua-files" }
# `--proc`: the memory panel's list, by the scan its window's host runs.
ronoctua-memory = { path = "../ronoctua-memory" }

anyhow.workspace = true
serde_json.workspace = true

[dev-dependencies]
# The kit's guards hold in these tests too (its `test-support`).
ronoctua-shell-kit = { path = "../ronoctua-shell-kit", features = [ "test-support" ] }

[lints]
workspace = true

[package.metadata.ronoctua]
# What this crate reads and what its programs are: `nix/rust/units.nix`.
env = ["RONOCTUA_KEYS_DIR"]
bins = { "ronoctua-render-png" = "driver" }
