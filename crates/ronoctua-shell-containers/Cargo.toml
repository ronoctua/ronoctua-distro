[package]
name = "ronoctua-shell-containers"
description = "The person's containers (LEADER s o): the view, its window, its region in the footer, its camera and its keys."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# ONE FEATURE, ONE CRATE (the 2026-10-12 wave): the view, its window, the
# region the footer hosts and the camera stand on the kit and the door alone,
# so a line of the containers' view recompiles this crate and the binary that
# links it — never the footer, never another view.
[dependencies]
ronoctua-shell-kit = { path = "../ronoctua-shell-kit" }
ronoctua-shell-door = { path = "../ronoctua-shell-door" }

ronoctua-tokens = { path = "../ronoctua-tokens" }
ronoctua-render = { path = "../ronoctua-render" }
ronoctua-keymap = { path = "../ronoctua-keymap" }
ronoctua-cmd = { path = "../ronoctua-cmd" }
ronoctua-i18n = { path = "../ronoctua-i18n" }
ronoctua-files = { path = "../ronoctua-files" }
ronoctua-consent = { path = "../ronoctua-consent" }
ronoctua-transfers = { path = "../ronoctua-transfers" }
# THE PERSON'S CONTAINERS: the one crate that runs podman — the listing, the
# actions, the log and the stats as children only while shown; pulls,
# builds and compose go to the queue.
ronoctua-containers = { path = "../ronoctua-containers" }
# The firewall's verdict on a published port, read as the person — never the
# sudo door (`sudo-door-is-one`).
ronoctua-security = { path = "../ronoctua-security" }
# What `inspect` answers, coloured as JSON is coloured everywhere else.
ronoctua-syntax = { path = "../ronoctua-syntax" }
ronoctua-design = { path = "../ronoctua-design" }

smithay-client-toolkit.workspace = true
anyhow.workspace = true
tracing.workspace = true

[dev-dependencies]
# The door's and the kit's guards hold in these tests too (`test-support`).
ronoctua-shell-door = { path = "../ronoctua-shell-door", features = [ "test-support" ] }

[lints]
workspace = true

[package.metadata.ronoctua]
# What this crate reads and what its programs are: `nix/rust/units.nix`.
env = ["RONOCTUA_KEYS_DIR"]
