[package]
name = "ronoctua-power"
description = "The one boundary with UPower, power-profiles-daemon and logind: batteries, the charger, the profile, sleep."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# zbus only enters the three proxy modules (`upower.rs`, `profiles.rs`,
# `login.rs`). The rules — which rung a percentage is, when the modeline shows
# a glyph, which profile is the top one a daemon offers, what counts as a
# transition worth a notification — live in `lib.rs` and do not import them:
# that is what makes them testable against property maps copied off a real
# machine, with no bus, no battery and no root.
#
# NO `[[bin]]`: nothing here is a daemon. The footer raises the threads.

[dependencies]
zbus.workspace = true
anyhow.workspace = true
# The watching threads outlive whoever asked for them, and when a daemon goes
# away there is nobody to return an error to — so they say so to the log.
tracing.workspace = true
# `power.json`, the person's chosen profile — one field, read by a `Store`:
# a hand-edited file with one wrong value still names it (the repair says
# what it held), and a write keeps the fields this machine does not know.
serde.workspace = true
serde_json.workspace = true
ronoctua-store = { path = "../ronoctua-store" }
# Where `power.json` lives.
ronoctua-xdg = { path = "../ronoctua-xdg" }
# THE ONE WALK OF `/sys/class/power_supply`. The brain's `on_battery` and the
# charge thresholds read different files of the same directories; the walk is
# `ronoctua-memory`'s, which is the declared frontier with `/sys` and `/proc`,
# and this crate reads its files through the paths it hands back.
ronoctua-memory = { path = "../ronoctua-memory" }

[lints]
workspace = true
