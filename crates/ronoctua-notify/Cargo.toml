[package]
name = "ronoctua-notify"
description = "Notification queue, filterable tray and the icon chain (section 4.2)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# zbus only enters `dbus.rs`. The queue, the filter and the icon chain — which is
# where the business rules live — do not import it, and that is what makes it possible to test
# "a critical one never disappears on its own" without bringing up a bus.
[dependencies]
# The two XDG roots, in the one crate that owns them (zero dependencies).
ronoctua-xdg = { path = "../ronoctua-xdg" }
zbus.workspace = true
tracing.workspace = true
# The history outlives the session and the person's filters outlive a rebuild.
# Both are files this crate reads and writes — see `store.rs` for why they are
# two files in two directories.
serde.workspace = true
serde_json.workspace = true
# Step 2 of the chain finds the FILE; these two turn it into pixels. The
# superpackage is 335,031 SVGs against 53 PNGs, so the vector rasteriser is not
# optional — see `icon::rasterize`.
resvg.workspace = true
# `ico` on top of the workspace's decoders, and HERE rather than there: a
# program's own icon is where the format still lives. A hand-made `.desktop`
# points `Icon=` at the `favicon.ico` it came with, and a web app's icon comes
# off a site whose last resort is exactly that file. Without the feature those
# were `None` — the row kept its category glyph, and nothing said why. It is a
# BMP or PNG in a directory header, so it costs the two decoders already here
# and no store path.
image = { workspace = true, features = [ "ico" ] }

# The probe that exercises the chain against the REAL superpackage. It is a binary,
# and not a `#[test]`, because the Nix check has to pass the store path in.
[[bin]]
name = "ronoctua-test-icons"
path = "src/bin/test-icons.rs"

[lints]
workspace = true
