[package]
name = "ronoctua-git"
description = "The one boundary with git: the CLI by its store path, every call through one hardened command — for the file manager's git line and browser, and the belongings."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# THE CLI, NOT A LIBRARY. git is already in the base closure; porcelain v2
# with `-z` is a stable format; blame, renames, attributes and SHA-256
# repositories are mature there. gix would add hundreds of crates and an HTTP
# stack of its own (which `one-http-writer` refuses). So: no dependency at
# all — `std::process` and the parsers here.
#
# ONE OPTIONAL ONE, behind `clone`: the consent crate, for the one call that
# reaches a host nobody named before — `Repo::clone` takes a `Pass` for the
# host its address names. Optional because the askpass helper is built from
# this crate's sources by `rustc` alone (`nix/git-askpass.nix`), with no
# feature and so no dependency; the shell turns `clone` on.
[features]
default = []
clone = ["dep:ronoctua-consent"]

[dependencies]
ronoctua-consent = { path = "../ronoctua-consent", optional = true }

# THE ASKPASS HELPER. git runs it for a remote over HTTPS with a token; it
# prints the user name or the token, read from the `0600` file whose PATH is
# all the environment carries. A binary of its own because git runs a
# PROGRAM — a flag cannot answer a question. The one the system runs is
# built apart from the workspace (`nix/git-askpass.nix`), so its path can be
# compiled in; this target is what the tests run.
[[bin]]
name = "ronoctua-git-askpass"
path = "src/bin/askpass.rs"

# A TEST MINTS ITS PASS over a consent file of its own (`test-support`), and
# only here: a product mints from the person's file alone.
[dev-dependencies]
ronoctua-consent = { path = "../ronoctua-consent", features = ["test-support"] }

[lints]
workspace = true

[package.metadata.ronoctua]
# What this crate reads and what its programs are: `nix/rust/units.nix`.
env = ["RONOCTUA_GIT", "RONOCTUA_GIT_ASKPASS", "RONOCTUA_GIT_PQ_TLS", "RONOCTUA_SSH"]
run-env = ["RONOCTUA_GIT", "RONOCTUA_GIT_ASKPASS", "RONOCTUA_GIT_PQ_TLS", "RONOCTUA_SCRIPT", "RONOCTUA_SETSID", "RONOCTUA_SSH", "RONOCTUA_SSH_KEYGEN"]
bins = { "ronoctua-git-askpass" = "apart" }
