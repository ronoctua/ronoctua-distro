[package]
name = "ronoctua-transfers"
description = "The queue of slow work: what copies, what downloads, and what says where it is."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# ONE BORDER, ONE CRATE — the same shape as `ronoctua-files`, `ronoctua-memory`
# and `ronoctua-network`. What this one owns is the QUEUE: who is running, how
# far along, and the switch that pauses or stops it. It does not draw, does not
# translate and does not speak Wayland.
[dependencies]
# THE HTTP FRAMER, and not a fourth copy of one. See `one-http-writer`.
ronoctua-http = { path = "../ronoctua-http" }
# THE PO TOKEN'S FLAGS, shared with the player: the device is the same for both.
ronoctua-ytdlp = { path = "../ronoctua-ytdlp" }
# The disk. Every local operation in the queue is one of this crate's, watched —
# there is no second implementation of "copy a tree" here.
ronoctua-files = { path = "../ronoctua-files" }
# THE ARCHIVES: packing, unpacking, testing, adding, removing, converting —
# every one through the crate that runs 7zz, bsdtar and unrar by store path.
# The queue carries the work and the switch; it never names a program.
ronoctua-archive = { path = "../ronoctua-archive" }
# BitTorrent. The `unsafe` and the C++ live THERE and never here — this crate
# stays `forbid(unsafe_code)`, which is the whole reason the border is a crate
# of its own rather than a module.
ronoctua-torrent = { path = "../ronoctua-torrent" }
anyhow.workspace = true
tracing.workspace = true
# For `SIGSTOP`/`SIGCONT` on the media engine's process group — the one way to
# pause a subprocess that is not killing it and starting over.
rustix.workspace = true
# The wire. One JSON object per line, both ways: a path and a URL carry spaces,
# and a whitespace grammar loses half of one without saying so — the trap
# `leader.rs`'s `rsplit_once` already records.
serde = { workspace = true }
serde_json.workspace = true

# THE DAEMON, as its own binary.
#
# A `[[bin]]` so `nix/rust.nix` can extract JUST this: a derivation references
# what its BYTES cite, and shipping the whole workspace to run a copy would put
# the renderer, wgpu and the wasm runtime inside a unit that has no screen.
# THE REGION PACKS, for the engine that bakes one.
#
# It brings `ronoctua-zip` and nothing else — no `ronoctua-atlas`, so the
# globe's geometry does not follow a download queue into the ISO, which is the
# whole reason `rust.transfers` is extracted from the workspace.
ronoctua-atlas-packs = { path = "../ronoctua-atlas-packs" }
# The atomic write, and the only thing this daemon uses it for: a pack is
# installed whole or not at all.
ronoctua-xdg = { path = "../ronoctua-xdg" }
# THE PERSON'S PROGRAMS, as a LIBRARY and nothing more: the order this queue
# carries, the progress line it reads and the outcome it keeps. The work itself
# runs in that crate's CLI, as a child, so the TLS stack and the image decoders
# stay in the child's closure — `default-features = false` is the whole point
# (`transfers-unit-is-narrow`).
ronoctua-software = { path = "../ronoctua-software", default-features = false }
# THE PERSON'S BELONGINGS, as the order and the CLI's lines and nothing more:
# `age` is the CLI's, behind `crypt`, and stays out of this daemon.
ronoctua-belongings = { path = "../ronoctua-belongings", default-features = false, features = [ "prefs" ] }
# CHROME'S NATIVE-MESSAGING FRAMING and the caller's origin, from the crate
# that owns the running Chrome: one reader of that framing for both hosts. Its
# library is a JSON parser and a socket, nothing more.
ronoctua-browser = { path = "../ronoctua-browser" }
# THE SCAN'S LINES (`virustotal::Beat`), from the crate whose child prints
# them — without its `net` feature: the child carries the TLS, this does not.
ronoctua-lookup = { path = "../ronoctua-lookup", default-features = false }
# THE PERSON'S CONTAINERS, as a library: the job this queue carries, the
# podman that runs it (from the unit's environment, never baked in) and what
# its lines mean. Serde and nothing else — no socket, no decoder.
ronoctua-containers = { path = "../ronoctua-containers" }

# `SIGTERM` UNWINDS THE COPY. A stop with a copy in flight waits for the
# copy to remove what it wrote (`Shared::wind_down`); the handler is this
# crate's iterator, safe to call, so the queue stays `forbid(unsafe_code)`.
# Already in the lock, under the terminal emulator.
signal-hook.workspace = true

[[bin]]
name = "ronoctua-transfers"
path = "src/bin/daemon.rs"

[dependencies.tracing-subscriber]
workspace = true

[lints]
workspace = true
