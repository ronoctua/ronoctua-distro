[package]
name = "ronoctua-shell-bluetooth-words"
description = "The radio as the shell says it: the modeline's device marks, the pairing question and its answers, BlueZ's refusals, the adapter's three orders — in the footer and the radio's view."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# THE RADIO, AS BOTH ITS DOORS AND THE FOOTER SAY IT (the 2026-10-12 wave):
# the footer keeps the radio for the session — the pairing agent, the marks,
# the alarms, the keys that act on the adapter with no view open — and names
# no feature, so what it shares with the radio's view stands under both, on no
# other shell crate (`<view crate>-words`, as the sound's, the power's and the
# studio's are).
[dependencies]
ronoctua-tokens = { path = "../ronoctua-tokens" }
ronoctua-i18n = { path = "../ronoctua-i18n" }
ronoctua-xdg = { path = "../ronoctua-xdg" }
ronoctua-files = { path = "../ronoctua-files" }
# The ONLY border with BlueZ.
ronoctua-bluetooth = { path = "../ronoctua-bluetooth" }

serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
# Whether the footer that wrote the standing question is still alive.
rustix = { workspace = true, features = [ "process" ] }

[lints]
workspace = true

[package.metadata.ronoctua]
# What this crate reads and what its programs are: `nix/rust/units.nix`.
env = ["RONOCTUA_KEYS_DIR"]
