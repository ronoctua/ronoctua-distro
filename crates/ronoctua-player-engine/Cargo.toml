[package]
name = "ronoctua-player-engine"
description = "The player's daemon: libmpv, its voices and their render threads, the decoders, the clock a set keeps, the subtitle lanes, and the ambient sounds."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# THE ONLY CRATE THAT LINKS libmpv. The protocol and the client are
# `ronoctua-player`, which is what the shell links — see its header for why
# this is a crate and not a feature.
[dependencies]
anyhow.workspace = true
tracing.workspace = true
serde.workspace = true
serde_json.workspace = true
# `fs` also carries inotify, which watches the drafts (`engine/drafts.rs`).
rustix = { workspace = true, features = [ "fs" ] }
ronoctua-player = { path = "../ronoctua-player" }
ronoctua-playlist = { path = "../ronoctua-playlist" }
ronoctua-frames = { path = "../ronoctua-frames" }
ronoctua-store = { path = "../ronoctua-store" }
ronoctua-xdg = { path = "../ronoctua-xdg" }
# The framer, for the media server another machine reads from, and HTTPS
# with redirects (`web`) for a radio's list on a server (`engine/resolve.rs`).
ronoctua-http = { path = "../ronoctua-http", features = [ "tls" ] }
# EVERY lookup on the network — lyrics, sponsored segments, tags and covers,
# films, subtitles — and the person's keys for them: the one crate that talks
# to those hosts, with its one pace per host (`engine/desk.rs`,
# `engine/lookups.rs`, `engine/fetch.rs`).
ronoctua-lookup = { path = "../ronoctua-lookup" }
# The tailnet's own addresses and machines — the listener binds those and
# nothing else.
ronoctua-tunnel = { path = "../ronoctua-tunnel" }
# MPRIS, on the session bus: the blocking API, the workspace's one D-Bus.
zbus.workspace = true
# The PO token's flags, the transfer queue's own.
ronoctua-ytdlp = { path = "../ronoctua-ytdlp" }
# The subtitle lanes' colours and sizes (`engine/subtitles.rs`): the daemon
# draws them into the film with no door open, and resolves the tokens itself.
ronoctua-tokens = { path = "../ronoctua-tokens" }
# The sound outputs a lane can be sent to: the one crate that talks to
# PipeWire reads them, only while a door shows them or a lane is sent to one
# (`engine/sinks.rs`). mpv is told the output by the name it gives.
ronoctua-audio = { path = "../ronoctua-audio" }
# A file's tags and covers, read and written (`engine/tags.rs`): the one
# boundary with them — lofty in the process, ffprobe, exiftool and
# Matroska's own tools by path — with its engine, which only the daemon links.
ronoctua-tags = { path = "../ronoctua-tags" }
# The directories — radio-browser, iptv-org, the Internet Archive — the one
# crate that talks to them (`engine/directory.rs`), with `net`: the daemon is
# the one process that asks them. And the player's cache: ONE directory under
# `$XDG_CACHE_HOME/ronoctua`, one ceiling (`assets/cache.nix`), the file read
# longest ago leaving first — the covers MPRIS is handed and the directories'
# lists are kept there.
ronoctua-broadcast = { path = "../ronoctua-broadcast" }
# Where a country's name goes on a map, read from the table the doors draw
# the globe with (`RONOCTUA_ATLAS`, at run time): a directory's page is
# placed here, and a door only draws it.
ronoctua-atlas = { path = "../ronoctua-atlas" }

# The queue's fingerprint (`engine/queue.rs`): SHA-256 of the queue as a
# file keeps it, to tell "not saved" from a queue that only moved — the TLS
# stack's own digest, already linked through `ronoctua-http`.
ring.workspace = true
# The lyrics translated (`engine/translate.rs`): the one crate that talks to
# a translator, asked on a thread of its own with the person's pass for the
# host.
ronoctua-words = { path = "../ronoctua-words" }
# The person's consent, host by host: a pass for the host a translation or a
# radio's list goes to, and the player's older list merged into it once; and
# every default source of the catalogue asks its hosts with a `Pass` only that
# crate mints (`engine/catalog.rs`), as a NASA video is opened on one.
ronoctua-consent = { path = "../ronoctua-consent" }

[dependencies.tracing-subscriber]
workspace = true

[dev-dependencies]
# A test mints its passes from a consent file of its own; the helpers that do
# are behind `test-support`, which no product takes (`network-asks-with-a-pass`).
ronoctua-consent = { path = "../ronoctua-consent", features = [ "test-support" ] }

[[bin]]
name = "ronoctua-player"
path = "src/main.rs"

[lints]
workspace = true
