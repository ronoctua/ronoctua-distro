[Context]
shared=network;ipc;
sockets=x11;wayland;pulseaudio;fallback-x11;pcsc;cups;!gpg-agent;
devices=all;
filesystems=xdg-download;xdg-config/gtk-3.0:ro;!home;
persistent=.mozilla;
unset-environment=QT_STYLE_OVERRIDE;

[Session Bus Policy]
org.freedesktop.FileManager1=talk
org.mozilla.firefox.*=own
org.a11y.Bus=talk

[System Bus Policy]
org.freedesktop.NetworkManager=talk

[Environment]
MOZ_ENABLE_WAYLAND=1
GTK_THEME=Adwaita:dark
