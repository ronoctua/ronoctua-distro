[package]
name = "ronoctua-parts"
description = "What reaches a machine after it is installed: each part the machine flake declares, realized on its own, kept in a profile of its own, and said — and root's realizer of them."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# THE LIBRARY IS PURE, as `ronoctua-person`'s is: the shell's page, the brain's
# module and the software centre link it to read the same records, and a
# library that ran `nix` would carry that into all of them. The one function
# that touches the disk is [`here`], a `stat` of a stable path — what every
# reader of a part asks before using it.
#
# `realize` IS ROOT'S HALF, the binary beside it, and a DEFAULT feature so the
# workspace build compiles it (a member's `[[bin]]` is built only when
# something enables its required features). It adds `rustix` (the records and
# the session view are written with `openat`, `O_NOFOLLOW` and a rename),
# `ronoctua-network` (whether a failed download met a machine with no link)
# and `ronoctua-machine` (its reader of a dry run).
[features]
default = [ "realize" ]
realize = [ "dep:rustix", "dep:ronoctua-network", "dep:ronoctua-machine" ]

[dependencies]
serde.workspace = true
serde_json.workspace = true
# THE FILE CONTRACT every machine file keeps — `format`, kebab-case, a newer
# format refused before its fields, the stamps — is `ronoctua-person`'s; its
# library is the same pure serde.
ronoctua-person = { path = "../ronoctua-person", default-features = false }
rustix = { workspace = true, features = [ "fs", "process" ], optional = true }
# NetworkManager's one door: whether there is a link at all.
ronoctua-network = { path = "../ronoctua-network", optional = true }
# THE DRY RUN, as the machine's rebuild reads it (`ronoctua_machine::dry`):
# one reader of Nix's "will be built" for the system and for every part.
ronoctua-machine = { path = "../ronoctua-machine", optional = true }

# ROOT'S HALF, as its own binary, so `nix/rust.nix` extracts JUST this
# (`parts`): the units that run it as root must not carry the renderer.
[[bin]]
name = "ronoctua-parts"
path = "src/bin/parts/main.rs"
required-features = [ "realize" ]

[lints]
workspace = true

[package.metadata.ronoctua]
# What this crate reads and what its programs are: `nix/rust/units.nix`.
env = ["RONOCTUA_MACHINE_DIR"]
run-env = ["RONOCTUA_NIX", "RONOCTUA_SYSTEMCTL", "RONOCTUA_SYSTEMD_RUN"]
