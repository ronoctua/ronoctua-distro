[package]
name = "ronoctua-rescue"
description = "The rescue console — Ctrl+Alt+Del, two doors."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "ronoctua-rescue"
path = "src/bin/rescue.rs"

# WHAT IS NOT HERE IS THE POINT.
#
# No `ronoctua-term` and no `ronoctua-render`. The first one cites
# `libghostty-vt`, which drags Zig, clang and LLVM (1,70 GiB); the second drags
# mesa and vulkan. This binary exists for when the machine is broken, and
# `iso-has-no-toolchain` (`tests/checks.nix`) is what says so out loud.
#
# What is left is a terminal application: the two generated crates (text and
# tokens), the two borders it needs to read (the compositor and `/proc`), and
# ratatui — the same stack, the same versions, as the installer's TTY.
[dependencies]
ronoctua-i18n = { path = "../ronoctua-i18n" }
ronoctua-tokens = { path = "../ronoctua-tokens" }
# The compositor's border, to list and close a window (invariant 3).
ronoctua-compositor = { path = "../ronoctua-compositor" }
ronoctua-scroll = { path = "../ronoctua-scroll" }
# The machine's border, to read memory and stop what is eating it. The only
# crate that touches `/proc`, and this app does not become a second one.
ronoctua-memory = { path = "../ronoctua-memory" }
# `Consumer`, which is what `ronoctua-memory` speaks. It is the WIT mirror in
# plain Rust — no wasm toolchain comes with it.
ronoctua-protocol = { path = "../ronoctua-protocol" }
anyhow.workspace = true
ratatui = { version = "0.29", default-features = false, features = [ "crossterm" ] }
crossterm = "0.28"

[lints]
workspace = true

[package.metadata.ronoctua]
# What this crate reads and what its programs are: `nix/rust/units.nix`.
env = ["RONOCTUA_BTOP", "RONOCTUA_FC_CACHE", "RONOCTUA_JOURNALCTL", "RONOCTUA_KEYS_DIR", "RONOCTUA_MACHINE_DIR", "RONOCTUA_PKTTYAGENT", "RONOCTUA_RESCUE_SHELL", "RONOCTUA_SYSTEMCTL"]
run-env = ["RONOCTUA_FC_CACHE", "RONOCTUA_RESCUE_SHELL", "RONOCTUA_SYSTEMCTL"]
