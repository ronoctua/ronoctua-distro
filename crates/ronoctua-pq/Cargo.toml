[package]
name = "ronoctua-pq"
description = "Post-quantum age: the person's mlkem768x25519 identities and recipients, sealing and opening streams, and the job the queue hands `ronoctua-seal`."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# TWO LAYERS, the belongings' shape.
#
# Without features this is the WIRE: the queue's `Job`, the lines
# `ronoctua-seal` prints, `Why`, `Kind` and `sniff` (a header is text). The
# transfer queue links only that (`default-features = false`), so the daemon
# that runs for as long as the machine is on never carries `age`.
#
# `crypt` is age itself: identities, recipients, `seal` and `open`, and the
# X-Wing KEM inside the stanza. `sign` is the person's ML-DSA-65 signatures
# and the signed manifest of a tree, from `aws-lc-rs` and without `age`: what
# root's applier (`ronoctua-person`) links to hold a staging to its pin.
# `cli` is the `ronoctua-seal` binary the queue runs as a child (extracted by
# `nix/rust.nix`).
[features]
default = [ "crypt", "cli", "sign" ]
crypt = [
  "dep:age",
  "dep:age-core",
  "dep:base64",
  "dep:bech32",
  "dep:hpke",
  "dep:ml-kem",
  "dep:rand",
  "dep:sha3",
  "dep:subtle",
  "dep:x25519-dalek",
  "dep:zeroize",
]
sign = [ "dep:aws-lc-rs", "dep:base64", "dep:zeroize" ]
cli = [ "crypt", "sign", "dep:rustix", "dep:ronoctua-archive" ]

[dependencies]
serde.workspace = true
serde_json.workspace = true
age = { workspace = true, optional = true }
# `age::Identity` and `age::Recipient` speak `age_core::format::Stanza`, which
# `age` does not re-export. The version `age` itself pins (already in the lock).
age-core = { version = "0.12.0", default-features = false, optional = true }
# The identities' and recipients' Bech32 (already in the lock, under `age`).
bech32 = { version = "0.11.1", optional = true }
zeroize = { workspace = true, optional = true }
# THE STANZA'S PIECES, every one already in the lock under `age` (its tagged
# PQ recipient is built on the same four), at the versions age pins: HPKE
# (RFC 9180, base mode), ML-KEM-768 (FIPS 203; `deterministic` for the
# known answers, `zeroize` so a decapsulation key is wiped on drop), X25519
# (`static_secrets`: the identity's half is a fixed scalar), SHA-3 (SHAKE256
# and SHA3-256 of X-Wing), and a constant-time comparison of seeds.
hpke = { version = "0.12.0", default-features = false, features = [ "alloc" ], optional = true }
ml-kem = { version = "0.2.3", features = [ "deterministic", "zeroize" ], optional = true }
x25519-dalek = { version = "2.0.1", features = [ "static_secrets" ], optional = true }
sha3 = { version = "0.10.9", optional = true }
subtle = { version = "2.6.1", optional = true }
# The operating system's randomness, as age itself draws it.
rand = { version = "0.8.7", optional = true }
# ML-DSA-65 (FIPS 204), SHA-256 and the seed's randomness for `sign`: the one
# implementation of the primitives our own code calls
# (`one-crypto-implementation`).
aws-lc-rs = { workspace = true, optional = true }
# The stanza's argument: unpadded, canonical base64.
base64 = { workspace = true, optional = true }
# `O_NOFOLLOW` for the secret files the CLI reads, in its safe spelling.
rustix = { workspace = true, optional = true }
# A FOLDER IS SEALED AS A TAR the CLI reads as bsdtar writes it — through the
# one crate that runs bsdtar (`one-archive-driver`), by its store path. The
# CLI's only: the wire the queue links never starts a program.
ronoctua-archive = { path = "../ronoctua-archive", optional = true }

[[bin]]
name = "ronoctua-seal"
path = "src/bin/seal.rs"
required-features = [ "cli" ]

# THE KNOWN ANSWERS AND THE GO CROSS-TEST'S OTHER HALF: `vectors` (what
# `pq-xwing-vectors` runs), `identity` (a fresh PQ identity into a new `0600`
# file, its recipient on stdout — what `pq-age-interop` hands Go), `mixed` (a
# file sealed to a PQ and a classical recipient at once, which no honest
# sealer writes), `debug` (an identity's `Debug`, for
# `pq-identity-never-prints`) and `signing-key`/`debug-signing` (an ML-DSA-65
# signing key into a new `0600` file, and its `Debug`s, for the same check).
[[bin]]
name = "ronoctua-test-pq"
path = "src/bin/test_pq.rs"
required-features = [ "cli" ]

[lints]
workspace = true

[package.metadata.ronoctua]
# What this crate reads and what its programs are: `nix/rust/units.nix`.
bins = { "ronoctua-test-pq" = "driver" }
