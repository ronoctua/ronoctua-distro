[package]
name = "ronoctua-belongings"
description = "The belongings: the person's configuration kept, encrypted, in a private git repository they name — what is kept, the plan and its conflicts, and the engine."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# TWO LAYERS, and the second stays out of the shell, the queue and the
# installer.
#
# `prefs` (serde and the XDG roots) is the SHAPE: `belongings.json`, what is
# kept (the table `assets/belongings.nix` generates), where every file of the
# belongings lives, the plan the engine writes, the decisions a door writes
# back, the status a sync leaves, and the order the queue carries. The shell,
# the queue and the installer link only this
# (`default-features = false, features = [ "prefs" ]`).
#
# `crypt` is the engine the extracted CLI (`rust.belongings`) runs: `age`
# (the post-quantum recipient of `ronoctua-pq`, one scrypt passphrase), the
# content-defined chunks, git as transport through `ronoctua-git` — on a
# consent `Pass` for the repository's host — and the three-way merge. It is a DEFAULT feature so the CLI —
# this crate's own `[[bin]]` — is built with every workspace build, and the
# three consumers above take it off by name: what they link never cites a
# symbol of `age`, and the linker leaves it out of their binaries.
[features]
default = [ "prefs", "crypt" ]
# `zeroize`: the listing (`inventory`) sums a file the size of an access
# file in memory wiped when it is dropped — it may be the deploy key.
# `ronoctua-person` (the data alone): which plain paths the person's
# signature covers is the staged tree's rule (`ronoctua_person::tree::signed`),
# and the local signed copy is named where the stager reads it.
prefs = [ "dep:zeroize", "dep:ronoctua-person" ]
crypt = [
  "prefs",
  "keyring",
  "offers",
  "dep:age",
  "dep:aws-lc-rs",
  "dep:ronoctua-git",
  "dep:rustix",
  "dep:fastcdc",
  "dep:ronoctua-pq",
  "dep:ronoctua-consent",
  "dep:zeroize",
  "dep:ronoctua-person",
]
# THE IDENTITY KEPT FOR THE SESSION (`unlock`): the kernel's keyring, through
# `linux-keyutils`. The CLI's; a door reads the marker the CLI leaves and
# never the keyring.
keyring = [ "prefs", "dep:linux-keyutils", "dep:zeroize" ]
# WHAT A RESTORE OFFERS, and saying yes to it (`offers`): the person's
# `options.json` (`ronoctua-person`, the data alone), git's global
# configuration (`ronoctua-git`) and VS Code's extensions (`ronoctua-vscode`:
# the list that travels, what is installed here, `code`; and the consent
# `Pass` of every Marketplace host its install reaches) — for the CLI, and
# for the door that draws the offers.
offers = [ "prefs", "dep:ronoctua-git", "dep:ronoctua-person", "dep:ronoctua-vscode", "dep:ronoctua-consent" ]

[dependencies]
serde.workspace = true
serde_json.workspace = true
# The roots every path of the belongings is logical against (`config/…`,
# `state/…`), per instance — the `.#dev` loop keeps its own.
ronoctua-xdg = { path = "../ronoctua-xdg" }
# The lenient stores' repair ledger (`state/repairs/`): its folder's name, and
# the files a sync says are waiting for "write the fix" or "leave it".
ronoctua-store = { path = "../ronoctua-store" }
age = { workspace = true, optional = true }
# SHA-256 of each kept file (the index's hashes, the three-way merge), and
# the keyed names of the chunks (HKDF and HMAC-SHA256 from the identity).
aws-lc-rs = { workspace = true, optional = true }
ronoctua-git = { path = "../ronoctua-git", optional = true }
# The machine's name, for the index (never in a commit): `uname`, not `/proc`.
rustix = { workspace = true, optional = true, features = [ "system" ] }
# FORMAT 2: content-defined chunks (FastCDC v2020), each sealed under a keyed
# id — no repository file reaches GitHub's limit, an edit moves few chunks.
fastcdc = { workspace = true, optional = true }
# THE IDENTITY IS POST-QUANTUM (`mlkem768x25519`): `key.age` holds an
# `AGE-SECRET-KEY-PQ-1…`, and every chunk and the index are sealed to its
# recipient. No other identity opens.
# AND THE PLAIN PART IS SIGNED (`sign`): ML-DSA-65, the key born with the
# repository and kept in `key.age` beside the identity.
ronoctua-pq = { path = "../ronoctua-pq", default-features = false, features = [ "crypt", "sign" ], optional = true }
# NOTHING IS FETCHED OR PUSHED BEFORE THE PERSON LET THE REPOSITORY'S HOST: a
# `Pass` minted from `consent.json` at the moment of every network call.
ronoctua-consent = { path = "../ronoctua-consent", optional = true }
# What opened `key.age` — the identity as text — is wiped when it is dropped.
zeroize = { workspace = true, optional = true }
# THE PERSON'S SOFTWARE LISTS MERGE BY THEIR OWN RULES (`merge_json`): two
# pin refreshes settled by the later edit, a deletion beating a pin-only
# change — the very merge the software centre's staging uses. The data alone
# (`default-features = false`): root's applier stays out.
ronoctua-person = { path = "../ronoctua-person", default-features = false, optional = true }
# THE IDENTITY KEPT FOR THE SESSION: the kernel's keyring (`@u`), never a file.
linux-keyutils = { workspace = true, optional = true }
# THE PERSON'S VS CODE EXTENSIONS (`offers`): which of their list are missing
# here, and the install a yes puts on the queue — the one crate that talks to
# VS Code's files and CLI.
ronoctua-vscode = { path = "../ronoctua-vscode", optional = true }

[dev-dependencies]
# A test's own consent file (`pass_in`, `let_hosts_in`): only here, never in a
# product (`network-asks-with-a-pass`).
ronoctua-consent = { path = "../ronoctua-consent", features = [ "test-support" ] }
# THE PUSH TOKEN'S SEALED HOME: a test holds the token's one logical path
# (`ronoctua_cachix::token::logical`) to the table's verdict — sealed, never
# plain (`belongings_token_is_sealed`).
ronoctua-cachix = { path = "../ronoctua-cachix" }

[build-dependencies]

# THE CLI, run by the queue as a child (`Work::Belongings`). It reads the
# passphrase from the `0600` runtime file the door wrote, and deletes it with
# the session.
[[bin]]
name = "ronoctua-belongings"
path = "src/bin/cli.rs"
required-features = [ "crypt" ]

[lints]
workspace = true

[package.metadata.ronoctua]
# What this crate reads and what its programs are: `nix/rust/units.nix`.
env = ["RONOCTUA_BELONGINGS_RS", "RONOCTUA_KEYS_DIR", "RONOCTUA_MACHINE_DIR", "RONOCTUA_SSH_KEYGEN"]
run-env = ["RONOCTUA_MACHINE_DIR", "RONOCTUA_SSH_KEYGEN"]
