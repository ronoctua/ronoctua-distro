[package]
name = "ronoctua-words"
description = "The one boundary with translation and dictionaries: MyMemory, DeepL, LibreTranslate, the offline English WordNet and Wiktionary."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# THE SHAPE OF `ronoctua-lookup`: every provider module is PURE without `net` —
# the address a question goes to, the headers and body it carries, what the
# answer means — and `net` adds the TLS transport that reaches a host. The
# offline English dictionary needs neither: a sorted TSV read by path
# (`RONOCTUA_WORDS`) with a binary search, nothing resident.
[features]
default = [ "net" ]
net = [ "ronoctua-http/tls", "dep:tracing" ]

[dependencies]
serde.workspace = true
serde_json.workspace = true
# The one log line the net writes: the host and the kind, never the address.
tracing = { workspace = true, optional = true }
# Every request carries a `Pass`; the DeepL and LibreTranslate keys are
# `Secret`s in a `0700` folder (`words-keys`).
ronoctua-consent = { path = "../ronoctua-consent" }
# The transport (`web`, with `tls`), and the framer's `Reply` without it.
ronoctua-http = { path = "../ronoctua-http" }

# A test mints its passes from a consent file of its own; the helpers that
# read one are `test-support`, never a product's.
[dev-dependencies]
ronoctua-consent = { path = "../ronoctua-consent", features = [ "test-support" ] }

[lints]
workspace = true
