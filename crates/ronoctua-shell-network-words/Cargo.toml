[package]
name = "ronoctua-shell-network-words"
description = "The way out as the shell says it: a tunnel's refusal, the hotspot's password file, the login page's opener, a mark's opening — in the footer and the network view."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# THE WAY OUT, AS ITS VIEW AND THE FOOTER SAY IT (the 2026-10-12 wave): the
# footer keeps NetworkManager's reading and the tunnels' for the session —
# the modeline's marks, the hotspot's password file that goes with the
# hotspot, a tailnet's login page — and names no feature, so what it shares
# with the network view stands under both, on no other shell crate.
[dependencies]
ronoctua-i18n = { path = "../ronoctua-i18n" }
ronoctua-xdg = { path = "../ronoctua-xdg" }
# The ONLY border with NetworkManager.
ronoctua-network = { path = "../ronoctua-network" }
# Tailscale's local API and Tor's control socket.
ronoctua-tunnel = { path = "../ronoctua-tunnel" }

serde.workspace = true
serde_json.workspace = true
tracing.workspace = true

[lints]
workspace = true

[package.metadata.ronoctua]
# What this crate reads and what its programs are: `nix/rust/units.nix`.
env = ["RONOCTUA_KEYS_DIR", "RONOCTUA_XDG_OPEN"]
