[package]
name = "ronoctua-shell-network"
description = "The network view (`LEADER s n`): its rows, its two doors — the footer's region and a window — and the one errand handler both carry out."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# THE NETWORK VIEW IN A CRATE OF ITS OWN (the 2026-10-12 wave): its view, its
# window, its region of the footer, its words, its camera and its keys, on the
# kit and the door only — so a line of it recompiles it and the binary, and
# nothing of the footer or of any other view.
[dependencies]
ronoctua-shell-kit = { path = "../ronoctua-shell-kit" }
ronoctua-shell-door = { path = "../ronoctua-shell-door" }
# The way out as this view and the footer say it — a tunnel's refusal, the
# hotspot's password file, the login page's opener, a mark's opening.
ronoctua-shell-network-words = { path = "../ronoctua-shell-network-words" }

ronoctua-tokens = { path = "../ronoctua-tokens" }
ronoctua-render = { path = "../ronoctua-render" }
ronoctua-i18n = { path = "../ronoctua-i18n" }
ronoctua-keymap = { path = "../ronoctua-keymap" }
ronoctua-cmd = { path = "../ronoctua-cmd" }
# The ONLY border with NetworkManager.
ronoctua-network = { path = "../ronoctua-network" }
# Tailscale's local API and Tor's control socket: the view's two sections.
ronoctua-tunnel = { path = "../ronoctua-tunnel" }
# The setting arithmetic of the Tor sheet.
ronoctua-options = { path = "../ronoctua-options" }
# WHO ELSE IS ON THIS NETWORK, and what each is called.
ronoctua-lan = { path = "../ronoctua-lan" }
ronoctua-resolve = { path = "../ronoctua-resolve" }
# The sockets and the interface counters (`/proc`).
ronoctua-memory = { path = "../ronoctua-memory" }

smithay-client-toolkit.workspace = true
anyhow.workspace = true
tracing.workspace = true

[dev-dependencies]
# The door's and the kit's guards hold in these tests too (`test-support`).
ronoctua-shell-kit = { path = "../ronoctua-shell-kit", features = [ "test-support" ] }
ronoctua-shell-door = { path = "../ronoctua-shell-door", features = [ "test-support" ] }

[lints]
workspace = true

[package.metadata.ronoctua]
# What this crate reads and what its programs are: `nix/rust/units.nix`.
# RONOCTUA_SYSTEMCTL: the VPN register starts `ronoctua-vpn-install.service`
# (`network_region::carry_out`), by the baked path — a unit's PATH is minimal.
env = ["RONOCTUA_KEYS_DIR", "RONOCTUA_SYSTEMCTL"]
