[package]
name = "ronoctua-inspect"
description = "The boundary with a file's CONTENT: pixels for the preview, facts for the panel."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# WHY A CRATE OF ITS OWN, AND NOT A MODULE OF `ronoctua-files`
#
# `ronoctua-files` builds `[[bin]] ronoctua-files-root`, and `nix/rust.nix`
# extracts that binary on purpose so what runs AS ROOT does not carry the
# desktop — `files-vm` asserts the closure. Putting image decoders and an SVG
# rasteriser in that crate would put them inside a root binary, which is the
# trap `AGENTS.md` records as "a derivation references what its BYTES cite".
#
# So the split is the same one `ronoctua-clipboard` and `ronoctua-notify`
# already have: one border, one crate. `ronoctua-files` is the border with the
# filesystem — names, sizes, modes, acts. This is the border with what is
# INSIDE a file.
[dependencies]
# THE MIME TABLE, and only that. It is 125 KB of generated data with an alias
# map and a subclass DAG, and there is exactly one of it: a second alias table
# here would be the "two implementations" this whole arrangement exists to
# prevent, and the day they disagreed nothing on screen would say which is
# right.
#
# The edge is ONE WAY — `ronoctua-files` does not depend on this crate — so
# `ronoctua-files-root` gains nothing from this line, which is the whole reason
# the two crates are separate.
ronoctua-files = { path = "../ronoctua-files" }
ronoctua-playlist = { path = "../ronoctua-playlist" }
# THE ONE RULER, for the spreadsheet's columns.
#
# `document::align` pads cells into columns, and a table padded by BYTES leans
# the moment a cell has an accent in it — `ronoctua_protocol::cells` is the
# function this whole tree measures with, and a second answer written here
# would be the defect `ink-is-not-a-count` exists to refuse. One workspace
# crate with one dependency of its own (`unicode-segmentation`), no store path
# and nothing new in the lock.
ronoctua-protocol = { path = "../ronoctua-protocol" }

# WHERE EACH COLOUR OF A LINE BEGINS AND ENDS.
#
# It is `no_std`, has no dependencies of its own, and is the same crate the
# shell's clipboard preview reads — so a `.rs` is coloured the same way whether
# it was copied or is being looked at in the file manager.
ronoctua-syntax = { path = "../ronoctua-syntax" }
tracing.workspace = true
# ffprobe, exiftool and pdfinfo all answer in JSON. The parsers here take a
# `&str` and give back facts, so a fixture in a test is worth more than an
# installed program — which is what lets these tests run with none of the
# tools present.
serde_json.workspace = true
# `poll` on the child's stdout, so ONE loop watches both the pipe and the
# clock. The alternative is a second thread pumping the pipe, and this crate
# promises to spawn none: the shell owns concurrency. `rustix` and not `libc`
# for the reason the workspace already gives — the API is safe.
rustix = { workspace = true, features = [ "event" ] }
# THE DECODERS, in process. `resvg` for SVG (`default-features = false` at the
# workspace, so no text engine and no second font machinery) and `image` for
# every raster — see the workspace's `image` line for what the feature list
# buys and what it costs.
image.workspace = true
resvg.workspace = true
# THE ZIP, which is a crate now and was a module here.
#
# A 3MF, the six office formats, an `.epub` and a REGION PACK for the atlas are
# all zips, and the last of those is baked by a crate that must not depend on
# this one. `src/zip.rs` is what is left: the translation from its trouble to
# this crate's refusal.
ronoctua-zip = { path = "../ronoctua-zip" }
# THE XML A 3MF AND THE OFFICE FORMATS NEED, and the deflate that WRITES one.
#
# `roxmltree` is already built under `usvg`, which this crate depends on one
# line up, and `flate2` arrives under `png`: naming them here costs compile
# time that was already being paid and adds nothing to the closure, which is
# the bar the workspace's own `image` line sets and what
# `files-closure-has-no-mime-db` measures.
#
# `flate2` is now only in `mesh::fixture::zip_of`, under `#[cfg(test)]` — the
# READING moved to `ronoctua-zip`, and a test that built its zip through the
# reader would be a test of nothing. What is deliberately NOT here, still, is a
# zip CRATE: walking a central directory and inflating one member is two
# hundred lines, and a lock entry for that is a dependency taken because it
# exists rather than because it is needed.
flate2 = "1.1"
roxmltree = "0.21"


[lints]
workspace = true
