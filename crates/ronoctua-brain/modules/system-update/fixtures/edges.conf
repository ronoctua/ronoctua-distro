# The lines where two readers of a table could part — the runner's `read`
# and the brain's `on_here` —, each held to what `edges-read.conf` says the
# runner makes of it: blanks and tabs round the words, a note after the
# state, a line commented after a blank, an id said twice (the first
# holds), and a last line with no newline, which `read` never hands over.

  person-fetch	on  
person-pins on # a note
person-sign on
person-sign off
	# person-stage on
person-stage off
machine-migrate on