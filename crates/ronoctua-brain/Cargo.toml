[package]
name = "ronoctua-brain"
description = "The brain as the system speaks to it: its wire, its mind, and the distro's modules as data."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# WHAT CROSSES THE BRAIN'S SOCKET, and nothing that runs. The footer, its
# windows and the brain's buffer link THIS to ask and to draw; the daemon
# (`ronoctua-brain-daemon`, whose binary is still `ronoctua-brain`) decides
# when anything runs and compiles every module's code, the person's included.
# So a line in a module, or a module the person writes, never recompiles the
# footer — see `src/lib.rs`.
#
# Every line below is either the wire's or the SHARED HALF of a module another
# crate names (`modules/<id>/shared.rs`, compiled here beside its manifest).
[dependencies]
# The two XDG roots, in the one crate that owns them (zero dependencies): the
# socket's path and the preferences' folders.
ronoctua-xdg = { path = "../ronoctua-xdg" }
# `when::Zone` — THE TZif READER, and the only reason this line exists: a
# moment in the person's own day (`moment::Offset`) needs the machine's zone,
# and a second reader would be the same hundred lines in a second place.
ronoctua-files = { path = "../ronoctua-files" }
# A PERSON'S FILE, written through the one crate that writes one: the brain's
# preferences, and the lines the LLM accounts' shared half keeps.
ronoctua-store = { path = "../ronoctua-store" }
# THE SHARED HALVES (`modules/<id>/shared.rs`), each through the one crate that
# is the border it reads — what a module's readers ask of the same machine its
# daemon half watches. The modules are not named here (a module is its folder,
# and only its `namedBy` may name it); what the halves read today:
#
# - the battery, as `ronoctua-memory` reads `/sys`;
# - the machine's record and its boot trial (`ronoctua-machine`, pure: serde,
#   the person crate's schemas and `geteuid`), and the declared programs the
#   verification held (`ronoctua-person`, its schemas alone);
# - how the last pull of the belongings ended (`ronoctua-belongings`'s
#   `prefs`: serde and the XDG roots, never `age`);
# - the LLM accounts, their limits and the usage endpoint's last answer, as
#   `ronoctua-llm` keeps them — WITHOUT `fetch`: no TLS client, no consent
#   pass, no credentials reader.
ronoctua-memory = { path = "../ronoctua-memory" }
ronoctua-machine = { path = "../ronoctua-machine" }
ronoctua-person = { path = "../ronoctua-person", default-features = false }
ronoctua-belongings = { path = "../ronoctua-belongings", default-features = false, features = [ "prefs" ] }
ronoctua-llm = { path = "../ronoctua-llm", default-features = false }
anyhow.workspace = true
tracing.workspace = true
# The wire. One JSON object per line on the socket, for the reason
# `ronoctua-transfers` writes down: a whitespace grammar loses half of a value
# that contains a space without saying so.
serde = { workspace = true }
serde_json.workspace = true

[lints]
workspace = true

[package.metadata.ronoctua]
# What this crate reads and what its programs are: `nix/rust/units.nix`.
env = ["RONOCTUA_BRAIN_MODULES_DIR", "RONOCTUA_MACHINE_DIR", "RONOCTUA_SYSTEMCTL"]
run-env = ["RONOCTUA_BRAIN_CATALOGUE", "RONOCTUA_SYSTEMCTL"]
beside = ["ronoctua-brain"]
# What this crate compiles of each module's folder: the manifest (which its
# build script finds a folder by) and the shared half. Never a module's code,
# its texts or its prose: an edit of those is the daemon's alone, and here it
# would rebuild the footer.
data = ["modules/*/manifest.nix", "modules/*/shared.rs"]
