[package]
name = "ronoctua-shell-history-words"
description = "Atuin as the shell says it: what a finished order of the shell's history says, in the history view's doors and the footer's own orders."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# WHAT THE SHELL'S HISTORY SAYS WHEN ATUIN ANSWERED (the 2026-10-12 wave): the
# footer says it of its own orders with no view open (`LEADER s h s` syncs)
# and the history view in both of its doors, so it stands under both — and on
# no other shell crate. A leaf of its own, and not a module of the kit,
# because the Atuin crate is a boundary that changes with Atuin (and bakes in
# its store path and the table of `assets/atuin-options.nix`): under the kit,
# a line of it would recompile every shell crate; here, it recompiles this,
# the history view and the binary.
[dependencies]
ronoctua-i18n = { path = "../ronoctua-i18n" }
ronoctua-atuin = { path = "../ronoctua-atuin" }

[lints]
workspace = true

[package.metadata.ronoctua]
# What this crate reads and what its programs are: `nix/rust/units.nix`.
env = ["RONOCTUA_KEYS_DIR"]
