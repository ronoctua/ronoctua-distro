[package]
name = "ronoctua-shell-overlays"
description = "The two overlays the owner approved: the screen capture's choice, and the resizer's curtains."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# THE OVERLAYS (inv. 14's two exceptions, the 2026-10-12 wave): the capture's
# layer, which exists only while what to keep is chosen (`capture.rs`), and
# the resizer's two curtains, which exist only while it is on (`resizer.rs`).
# They stand on the kit and the door, and nothing of the footer.
[dependencies]
ronoctua-shell-kit = { path = "../ronoctua-shell-kit" }
ronoctua-shell-door = { path = "../ronoctua-shell-door" }

ronoctua-tokens = { path = "../ronoctua-tokens" }
ronoctua-xdg = { path = "../ronoctua-xdg" }
ronoctua-render = { path = "../ronoctua-render" }
ronoctua-compositor = { path = "../ronoctua-compositor" }
ronoctua-cmd = { path = "../ronoctua-cmd" }
ronoctua-keymap = { path = "../ronoctua-keymap" }
ronoctua-i18n = { path = "../ronoctua-i18n" }
ronoctua-store = { path = "../ronoctua-store" }
ronoctua-files = { path = "../ronoctua-files" }

smithay-client-toolkit.workspace = true
wayland-client.workspace = true
rustix = { workspace = true, features = [ "event", "process" ] }
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
image.workspace = true
tracing.workspace = true

[dev-dependencies]
# The door's and the kit's guards hold in these tests too (`test-support`).
ronoctua-shell-door = { path = "../ronoctua-shell-door", features = [ "test-support" ] }

[lints]
workspace = true

[package.metadata.ronoctua]
# What this crate reads and what its programs are: `nix/rust/units.nix`.
env = ["RONOCTUA_KEYS_DIR"]
