[package]
name = "ronoctua-camera"
description = "The one boundary with V4L2: which cameras exist, what they can do, their controls, and the one door that opens one."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# ONE BORDER, ONE CRATE — the shape of `ronoctua-audio`. `v4l2.rs` is the only
# file in the tree that speaks a V4L2 ioctl, and `capture.rs` the only one that
# opens a camera for frames (checked by `one-camera-boundary` and
# `the-camera-has-one-door`). Everything else here is pure over plain structs,
# testable with no camera plugged in — which a build sandbox never has.
#
# GENERIC BY CONSTRUCTION: nothing here knows a vendor, a model or a laptop.
# A camera is whatever `/sys/class/video4linux` lists whose `device_caps` says
# VIDEO_CAPTURE; the format is chosen from what THAT device declares; and the
# identity is the device's own words (card, bus, interface), never its node
# number, which changes on every plug.
#
# NO `[[bin]]`: the studio daemon and the footer raise the threads.
[dependencies]
anyhow.workspace = true
tracing.workspace = true
serde.workspace = true
serde_json.workspace = true
rustix = { workspace = true, features = [ "event", "fs" ] }
ronoctua-store = { path = "../ronoctua-store" }

[lints]
workspace = true
