[package]
name = "ronoctua-world"
description = "The glance's data: clocks by zone, and weather and rates over HTTPS"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
anyhow.workspace = true
tracing.workspace = true
serde = { workspace = true }
serde_json.workspace = true

# THE HAND-WRITTEN HTTP/1.1 THIS PROJECT ALREADY HAS.
#
# It used to be `ronoctua-tunnel`, and the comment here said the dependency
# read oddly by its name and was right by its content — a world clock pulling
# in Tor and Tailscale for a chunk decoder. It now reads right by both: the
# framer is its own crate, because the Syncthing view would have made a third
# copy of it. The alternative was always a second chunked decoder, and the
# first one exists because a chunk boundary inside a multi-byte character
# panicked a thread and killed every tunnel key for a session.
ronoctua-http = { path = "../ronoctua-http", features = [ "tls" ] }
ronoctua-store = { path = "../ronoctua-store" }

# TLS COMES THROUGH `ronoctua-http`, AND NO LONGER FROM HERE.
#
# This crate had the first rustls in the workspace, and the reason was right:
# `aria2` talks to `127.0.0.1` and this talks to somebody else's machine. But
# ClipCascade's server is somebody else's machine too, and a second stack
# beside this one is the defect `ronoctua-http` exists to refuse — so the
# transport moved there, behind a feature, and this asks for the feature.
#
# Nothing new enters the closure: it is the same rustls, in one place.

[lints]
workspace = true
