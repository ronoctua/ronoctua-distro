[package]
name = "ronoctua-shell-manual"
description = "The manuals (LEADER h): their list, the shortcuts' and the gestures', in the footer's region and in a window."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# THE MANUALS (the 2026-10-12 wave): one view, its two doors — the footer's
# region and a window of its own — and the one handler of what they ask.
# They stand on the kit and the door, and name nothing of the footer.
[dependencies]
ronoctua-shell-kit = { path = "../ronoctua-shell-kit" }
ronoctua-shell-door = { path = "../ronoctua-shell-door" }

ronoctua-tokens = { path = "../ronoctua-tokens" }
ronoctua-i18n = { path = "../ronoctua-i18n" }
ronoctua-cmd = { path = "../ronoctua-cmd" }
ronoctua-keymap = { path = "../ronoctua-keymap" }
ronoctua-render = { path = "../ronoctua-render" }
# What a pose of the hands means, and its drawing (the gestures' manual).
ronoctua-gestures = { path = "../ronoctua-gestures" }
# The drawing rasterised (`notify::icon::from_svg`, the one SVG rasteriser).
ronoctua-notify = { path = "../ronoctua-notify" }

smithay-client-toolkit.workspace = true
anyhow.workspace = true

[dev-dependencies]
# The door's and the kit's guards hold in these tests too (`test-support`).
ronoctua-shell-kit = { path = "../ronoctua-shell-kit", features = [ "test-support" ] }
ronoctua-shell-door = { path = "../ronoctua-shell-door", features = [ "test-support" ] }
ronoctua-files = { path = "../ronoctua-files" }

[lints]
workspace = true

[package.metadata.ronoctua]
# What this crate reads and what its programs are: `nix/rust/units.nix`.
env = ["RONOCTUA_KEYS_DIR"]
