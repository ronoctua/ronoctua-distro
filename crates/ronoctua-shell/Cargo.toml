[package]
name = "ronoctua-shell"
description = "The binary: the footer's layer-shell surface, toplevels, daemon."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "ronoctua-shell"
path = "src/main.rs"

[[bin]]
# It draws a buffer into a PNG with no compositor and no VM. It is a binary, and
# not a `#[test]`, for the same reason the drivers are: what it produces is a
# FILE somebody looks at, and the thing it loads is a wasip2 component.
name = "ronoctua-render-png"
path = "src/bin/render-png.rs"

[dependencies]
ronoctua-tokens = { path = "../ronoctua-tokens" }
ronoctua-xdg = { path = "../ronoctua-xdg" }
ronoctua-render = { path = "../ronoctua-render" }
ronoctua-compositor = { path = "../ronoctua-compositor" }
# The calculator's engine (`LEADER =`).
ronoctua-calc = { path = "../ronoctua-calc" }
# THE PERSON'S CONSENT, host by host (`consent.json`): what the calculator's
# currency rates, a default source of the catalogue, the lyrics' translator,
# a video channel and a security check let — and the `Secret` a password or
# a passphrase crosses a door in.
ronoctua-consent = { path = "../ronoctua-consent" }
ronoctua-scroll = { path = "../ronoctua-scroll" }
# The ONLY border with NetworkManager. The shell does not speak network D-Bus
# directly, for the same reason it does not speak the compositor's IPC directly.
ronoctua-network = { path = "../ronoctua-network" }
ronoctua-cmd = { path = "../ronoctua-cmd" }
ronoctua-keymap = { path = "../ronoctua-keymap" }
ronoctua-i18n = { path = "../ronoctua-i18n" }
ronoctua-notify = { path = "../ronoctua-notify" }
ronoctua-apps = { path = "../ronoctua-apps" }
ronoctua-clipboard = { path = "../ronoctua-clipboard" }
ronoctua-protocol = { path = "../ronoctua-protocol" }
# THE TWO RAILS AND THE SCROLLBAR, from the crate that owns the vocabulary.
#
# The default features are the host's, which is what brings `rails` — the
# pixel side. A buffer takes this same crate with `default-features = false`
# and gets the cell side only; see `ronoctua-design`'s own manifest.
ronoctua-design = { path = "../ronoctua-design" }

# WHERE EACH COLOUR OF A LINE OF CODE BEGINS AND ENDS.
#
# It used to be a module of `ronoctua-clipboard`, which never used it: only the
# shell did. A highlighter that belongs to one app is a highlighter the next
# app copies, so it is a crate of its own — the clipboard's preview and the
# file manager's preview now colour the same Rust the same way because there is
# one implementation and one role-to-token map.
ronoctua-atlas = { path = "../ronoctua-atlas" }
# AND THE PACKS, which is the half that opens files: what a region's streets
# answer, and where they live. The pure crate above cannot name a directory —
# that is what makes it the one a buffer could ask.
ronoctua-atlas-packs = { path = "../ronoctua-atlas-packs" }
ronoctua-syntax = { path = "../ronoctua-syntax" }
ronoctua-runtime = { path = "../ronoctua-runtime" }
ronoctua-store = { path = "../ronoctua-store" }
ronoctua-term = { path = "../ronoctua-term" }
# The ONLY border with /proc, the cgroups and systemd's memory policy — the
# same arrangement as `ronoctua-network`: the shell asks, it reads.
ronoctua-files = { path = "../ronoctua-files" }
# THE BORDER WITH WHAT IS INSIDE A FILE — the preview's pixels and the info
# panel's facts. It enters HERE and not in `ronoctua-files`, which builds the
# root-privileged helper: image decoders and an SVG rasteriser inside a binary
# that runs as root is exactly what that split exists to prevent, and
# `files-vm` asserts the closure.
ronoctua-inspect = { path = "../ronoctua-inspect" }
# THE BORDER WITH GIT, for the file manager's git line and the history `C-h`
# opens (`git_line.rs`, `git_browser.rs`): the CLI by its store path, every
# call hardened, nothing written. And `clone`, for `LEADER / c`
# (`dev_clone.rs`): the one call that makes a repository, with a `Pass`.
ronoctua-git = { path = "../ronoctua-git", features = ["clone"] }
# THE POLL THE PLAYER READS ITS PIPE WITH — `rustix` and not `libc` because its
# API is SAFE, which is the same argument the terminal's pty makes one table
# down. The `event` feature is what `ronoctua-inspect` already enables for
# `tools::run`; enabling it here is what lets THIS crate name the call.
#
# It is not a nicety. A blocking `read_exact` on a child that has stopped
# writing hangs the player's thread for the rest of the session, with nothing on
# screen saying so, and that is the hole the owner asked not to exist.
rustix = { workspace = true, features = [ "event", "process" ] }
# THE DISK BORDER. It enters HERE and not in `ronoctua-files`, which builds the
# root-privileged helper: pulling zbus in there would put a D-Bus client inside
# a binary that runs as root, and would give that crate a second border. The
# host owns both and splices the device rows into the sidebar.
ronoctua-disks = { path = "../ronoctua-disks" }
# THE INSTALLER STICK: the releases (its `net`: GitHub on the person's pass),
# which drives may be written, the staging the root writer reads.
ronoctua-stick = { path = "../ronoctua-stick", features = [ "net" ] }
# THE POWER BORDER — UPower, power-profiles-daemon, logind — for the modeline's
# battery and profile marks, the power view and the three battery alarms.
ronoctua-power = { path = "../ronoctua-power" }
# THE MACHINE'S OWN CLOCK — `systemd-timedated`. `LEADER s l` is where somebody
# looks for the time zone and for whether anything is keeping the clock right,
# and for a whole release that screen could change only what the interface
# draws. One crate, because the brain's clock watch asks the same
# daemon and two readers would be two answers about one clock.
ronoctua-clock = { path = "../ronoctua-clock" }
# The screens: what they can do, how bright they are, and how big the text is.
ronoctua-display = { path = "../ronoctua-display" }
# The pointing devices and the seat each is on: the settings view, and the
# colour every cursor's hover band is painted in.
ronoctua-pointers = { path = "../ronoctua-pointers" }
# THE ONE BOUNDARY WITH PIPEWIRE. The modeline draws two marks off it at
# rest and the bare volume keys act through it with no view open, so the
# footer holds its threads for the whole session — the power crate's
# arrangement, and its reason.
ronoctua-audio = { path = "../ronoctua-audio" }
# THE CAMERA: the V4L2 boundary (the settings' list of cameras and their
# controls), the studio's wire and preview, and the effect table the rings walk.
ronoctua-camera = { path = "../ronoctua-camera" }
ronoctua-studio = { path = "../ronoctua-studio" }
# What a pose of the hands means (`gestures.rs`).
ronoctua-gestures = { path = "../ronoctua-gestures" }
# The player's CLIENT only: its socket, its words and its frames. The engine is
# `ronoctua-player-engine`, a crate of its own, so libmpv never reaches here.
ronoctua-player = { path = "../ronoctua-player" }
# The words of what the player says about a file (`Say::Sheet`: fields,
# covers, streams, why a change is refused), of its online lookups (a
# service, why it gave nothing, the person's keys) and of its directories
# (a source, why it gave nothing, the favourites' kinds): SCHEMA only, each
# without its default features — lofty, the programs, TLS and the caches are
# the daemon's, and a door never reads a tag nor asks a host itself.
ronoctua-tags = { path = "../ronoctua-tags", default-features = false }
# EXCEPT THE SECURITY CENTRE'S THREE CHECKS (`crate::security`): a file's
# hash to VirusTotal, an address to XposedOrNot, five digits of a password's
# hash to Pwned Passwords — asked by the door the person pressed, on its
# thread, with the person's pass for the host (`internet::Internet`), since there
# is no daemon of the centre's to ask. Hence `net`.
ronoctua-lookup = { path = "../ronoctua-lookup", default-features = false, features = [ "net" ] }
# AND THE LOCAL CATALOGUE, which a door READS itself (`player_catalog`):
# `catalog` brings SQLite over the system's libsqlite3, without TLS.
ronoctua-broadcast = { path = "../ronoctua-broadcast", default-features = false, features = [ "catalog" ] }
# The adult catalogue's lock: the person's system password, checked through
# the one crate that speaks PAM, on a thread of the door's.
ronoctua-pam = { path = "../ronoctua-pam" }
# THE LYRICS' TRANSLATOR, for the player's doors: the host the daemon asks
# (`MYMEMORY_HOST`), named where it is decided — and fast-access's
# dictionary, synonyms and translations (`/d`, `/s`, `/t`), which the door
# asks itself, on its own threads, with the person's pass for the host, as
# the security centre asks its three checks: hence `net`.
ronoctua-words = { path = "../ronoctua-words", default-features = false, features = [ "net" ] }
ronoctua-effects = { path = "../ronoctua-effects" }
ronoctua-syncthing = { path = "../ronoctua-syncthing" }
ronoctua-bluetooth = { path = "../ronoctua-bluetooth" }
ronoctua-keyboards = { path = "../ronoctua-keyboards" }
# Independent keyboards: the remapper's rules and the socket its leader
# comes through. The shell never opens a device; the daemon does.
ronoctua-keys = { path = "../ronoctua-keys" }
# The diverted keyboard's keys, translated with ITS layout — the same crate
# SCTK compiles every Wayland keymap with.
xkbcommon = "0.8"
# THE TWO TUNNELS — Tailscale's local API and Tor's control socket — for the
# modeline's two marks and the network view's two sections. Neither daemon
# signals, so the crate polls on a thread of its own; a machine with neither
# installed pays one `connect` that fails.
ronoctua-tunnel = { path = "../ronoctua-tunnel" }
# THE SHARED ARITHMETIC OF A DECLARED SETTING. The Tor sheet asks a
# `Kind` what a key should do to a row, and three more tables will.
ronoctua-options = { path = "../ronoctua-options" }
# CLIPCASCADE, SPOKEN NATIVELY. The clipboard panel has carried
# "not integrated" since the placeholder went in; this is what makes
# the word true, and it is why the footer's own history is what syncs
# rather than a second watcher of the same clipboard.
ronoctua-clipcascade = { path = "../ronoctua-clipcascade" }
# THE SHELL HISTORY. `LEADER s h` is the first screen this distro has ever
# had for it: `atuin` was installed and configured by a rebuild, and
# choosing between two search modes is not a decision the size of one.
ronoctua-atuin = { path = "../ronoctua-atuin" }
ronoctua-world = { path = "../ronoctua-world" }
# WHO ELSE IS ON THIS NETWORK: the unprivileged ICMP sweep and the vendor
# behind a hardware address. No daemon and no privilege — see the crate.
ronoctua-lan = { path = "../ronoctua-lan" }
# AND WHAT EACH OF THEM IS CALLED: systemd-resolved's `ResolveAddress`, asked
# on a thread for the rows the view shows — the one crate that talks to it.
ronoctua-resolve = { path = "../ronoctua-resolve" }
# The queue. The shell asks it for work and listens for the list; it never
# copies anything itself.
ronoctua-transfers = { path = "../ronoctua-transfers" }
# ENCRYPT ANYTHING'S WIRE: the queue's `Job`, `sniff` (what a `.age`'s header
# says) and `is_recipient` (a pasted key checked before it is queued) —
# WITHOUT features: `age` is `ronoctua-seal`'s, never the footer's
# (`transfers-never-link-age`).
ronoctua-pq = { path = "../ronoctua-pq", default-features = false }
ronoctua-memory = { path = "../ronoctua-memory" }
# WHEN the machine does something to itself. The shell holds no schedule of its
# own: it watches the daemon's socket, draws the countdown and sends back the
# two answers to it — the same arrangement as the transfer queue one line up.
ronoctua-brain = { path = "../ronoctua-brain" }
# THE PERSON'S LLM ACCOUNTS (`LEADER m a`): the list, each account's plan,
# limits, usage and tokens, read through the one crate that reads the agents'
# state — on the view's threads; and the refresh, asked from a door.
ronoctua-llm = { path = "../ronoctua-llm" }
# THE PERSON'S OWN PROGRAMS (`LEADER i`). The shell links the library for what
# is quick and read-only — the installed list, the search, a sheet's details,
# a picture — on its own threads; every order that changes the machine goes to
# the queue, which runs the crate's CLI. `net` is the search and the pictures
# from the network, `draw` the icon decoder.
ronoctua-software = { path = "../ronoctua-software", features = [ "net", "draw" ] }
# THE PERSON'S RUNNING CHROME — the kiosk's bridge. The footer is its
# socket's SERVER (`serve`), and this is also where the wire's words, the
# kiosk's command line and which addresses a kiosk may take are written; the
# host binary Chrome starts is the same crate's, and nothing of it links here.
ronoctua-browser = { path = "../ronoctua-browser" }
# A PERSON'S ARCHIVES, walked into like folders and opened from — through the
# one crate that runs 7zz, bsdtar and unrar (`files_archive.rs`) — and a
# password or a passphrase held as a `Secret`: printed as nothing, wiped when
# dropped, handed to a program's stdin or to udisks and nowhere else.
ronoctua-archive = { path = "../ronoctua-archive" }
# THE ICONS APP (`LEADER m i`): the three tables, read at RUN time from
# `RONOCTUA_ICONSET`, the one search and the copy formats.
ronoctua-iconset = { path = "../ronoctua-iconset" }
# THE VIDEO CATALOGUE (`LEADER v`): read through `Catalog::open_ro` and
# written through `Person` — the two openers this shell may use
# (`video-metrics-readers-are-read-only`); `net` for adding a channel, which
# asks yt-dlp who it is and lets the hosts a scan asks.
ronoctua-video-metrics = { path = "../ronoctua-video-metrics", features = [ "net" ] }
# The names of what yt-dlp answers, which the view says — and fast-access's
# search of YouTube (`/y`, `ronoctua_ytdlp::search`).
ronoctua-ytdlp = { path = "../ronoctua-ytdlp" }
# FAST-ACCESS'S SUPER INDEX, READ (`crate::fast_access_search`): the reader
# and nothing else — `engine` without `write`, so the crawlers and the unit
# stay the unit's, and a door opens the index read-only while a view shows it;
# `man` for a manual page's first lines in the detail.
ronoctua-index = { path = "../ronoctua-index", default-features = false, features = [ "engine", "man" ] }
# FAST-ACCESS'S `/w`: Wikipedia, DuckDuckGo, the person's SearXNG or Brave
# key, asked on a thread of the door's with the person's pass for the host.
ronoctua-websearch = { path = "../ronoctua-websearch" }
# THE STOP OF A REQUEST IN FLIGHT (`web::Abort`), and nothing else: fast-access
# pulls every stop of the last key's requests on the next one. The requests are
# made by the crates that own their hosts (`ronoctua-websearch`,
# `ronoctua-words`, `ronoctua-video-metrics`), which turn `tls` on already —
# named here because `web::Abort` lives under it.
ronoctua-http = { path = "../ronoctua-http", default-features = false, features = [ "tls" ] }
# THE SECURITY CENTRE (`crate::security`): the sudo door (`authority`, which
# only this crate turns on — `sudo-door-is-one`), the firewall's settings and
# status, fingerprints and the device's facts — and, read as the person, the
# firewall's verdict on a container's published port.
ronoctua-security = { path = "../ronoctua-security", features = [ "authority" ] }
# THE /private VAULT: its status and verdict files read, its request staged
# (`crate::vault`). Nothing of its root side runs here: that is its unit's.
ronoctua-private = { path = "../ronoctua-private" }
# THE SUDO BAR's password line, wiped when answered, cancelled or dropped
# (`crate::sudo_bar`), and a pasted one with it.
zeroize.workspace = true
# THE PERSON'S CONTAINERS (`LEADER s o`). The one crate that runs podman —
# the listing, the actions, the log and the stats as children only while
# shown; pulls, builds and compose go to the queue.
ronoctua-containers = { path = "../ronoctua-containers" }
# THE BORDER WITH INCUS (`LEADER s x`, `crate::incus`): its REST socket, its
# events and its CLI — the one crate that talks to it (`one-incus-boundary`).
ronoctua-incus = { path = "../ronoctua-incus", default-features = false, features = [ "client" ] }
# THE PERSON'S BELONGINGS (`LEADER s v`): their SHAPES only — the settings,
# what is kept, the plan and its decisions, the orders. `age` is the CLI's,
# behind `crypt`, which the queue runs as a child; the footer never links it.
# `offers`: saying yes to what a sync brought (SSH signing through git's
# configuration, a security key in the person's options) — still no `age`.
ronoctua-belongings = { path = "../ronoctua-belongings", default-features = false, features = [ "prefs", "offers" ] }
# THE PERSON'S BINARY CACHE (`crate::binary_cache`, a page of the update's
# view): their copy of the choice, the token (sealed, `0600`), the record of
# the last push and what root's netrc should be — through the one crate that
# knows Cachix; and the person's options, by the one validator.
ronoctua-cachix = { path = "../ronoctua-cachix" }
# The person's options, and THE KEY ROOT PINNED (`local/signer.json` in the
# machine directory), as the belongings view shows it: read with the person
# crate's one reader, the data alone (no `apply`: nothing of root's is linked).
ronoctua-person = { path = "../ronoctua-person", default-features = false }

# Integration with the compositor through wlr-layer-shell and IPC (invariant 3),
# and the virtual keyboard and pointer the owner approved as its exceptions —
# see `src/virtual_keys.rs` and `src/virtual_pointer.rs`, the only files that
# name them.
smithay-client-toolkit.workspace = true
wayland-client.workspace = true
wayland-protocols-wlr.workspace = true
wayland-protocols-misc.workspace = true
raw-window-handle.workspace = true

wgpu.workspace = true
anyhow.workspace = true
# The three font descriptions a toolkit reads, as they were BEFORE this
# system ever touched them — see `toolkits::Untouched`. One tiny file, so a
# size can be applied again and again without compounding.
serde = { workspace = true }
serde_json.workspace = true
base64.workspace = true
resvg.workspace = true
image.workspace = true
pollster.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[lints]
workspace = true
