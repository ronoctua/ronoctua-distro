[package]
name = "ronoctua-shell"
description = "The binary: the footer's layer-shell surface, toplevels, daemon."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "ronoctua-shell"
path = "src/main.rs"

[dependencies]
# THE FOUNDATION: the vocabulary (the theme, the keymap's registry, the
# relays to the footer's socket), every window's plumbing (the column, the
# opener) and the work's words the host of buffers is handed.
ronoctua-shell-kit = { path = "../ronoctua-shell-kit" }
ronoctua-shell-door = { path = "../ronoctua-shell-door" }
ronoctua-shell-work = { path = "../ronoctua-shell-work" }
# THE FOOTER, a crate of its own that names no feature: this binary hands it
# the regions it hosts and their residents (`main.rs`, `regions.rs`).
ronoctua-shell-footer = { path = "../ronoctua-shell-footer" }
# THE HOST OF THE WASM BUFFERS, a door of this binary's (`ronoctua-shell
# buffer`), handed the queue's words.
ronoctua-shell-buffers = { path = "../ronoctua-shell-buffers" }
# THE FEATURES, each a crate of its own — its view, its windows and their
# camera, its region of the footer and its keys — which this binary is the
# one crate to name: in its tables of doors and cameras (`main.rs`,
# `photograph.rs`), its regions (`regions.rs`) and its keymap (`keymap.rs`).
ronoctua-shell-agents = { path = "../ronoctua-shell-agents" }
ronoctua-shell-audio = { path = "../ronoctua-shell-audio" }
ronoctua-shell-belongings = { path = "../ronoctua-shell-belongings" }
ronoctua-shell-bluetooth = { path = "../ronoctua-shell-bluetooth" }
ronoctua-shell-calc = { path = "../ronoctua-shell-calc" }
ronoctua-shell-camera = { path = "../ronoctua-shell-camera" }
ronoctua-shell-catalogue = { path = "../ronoctua-shell-catalogue" }
ronoctua-shell-clipboard = { path = "../ronoctua-shell-clipboard" }
ronoctua-shell-containers = { path = "../ronoctua-shell-containers" }
ronoctua-shell-display = { path = "../ronoctua-shell-display" }
ronoctua-shell-fast-access = { path = "../ronoctua-shell-fast-access" }
ronoctua-shell-files = { path = "../ronoctua-shell-files" }
ronoctua-shell-git = { path = "../ronoctua-shell-git" }
ronoctua-shell-history = { path = "../ronoctua-shell-history" }
ronoctua-shell-icons = { path = "../ronoctua-shell-icons" }
ronoctua-shell-incus = { path = "../ronoctua-shell-incus" }
ronoctua-shell-lifeline = { path = "../ronoctua-shell-lifeline" }
ronoctua-shell-locale = { path = "../ronoctua-shell-locale" }
ronoctua-shell-manual = { path = "../ronoctua-shell-manual" }
ronoctua-shell-network = { path = "../ronoctua-shell-network" }
ronoctua-shell-notifications = { path = "../ronoctua-shell-notifications" }
ronoctua-shell-overlays = { path = "../ronoctua-shell-overlays" }
ronoctua-shell-player = { path = "../ronoctua-shell-player" }
ronoctua-shell-pointers = { path = "../ronoctua-shell-pointers" }
ronoctua-shell-power = { path = "../ronoctua-shell-power" }
ronoctua-shell-security = { path = "../ronoctua-shell-security" }
ronoctua-shell-software = { path = "../ronoctua-shell-software" }
ronoctua-shell-stick = { path = "../ronoctua-shell-stick" }
ronoctua-shell-syncthing = { path = "../ronoctua-shell-syncthing" }
ronoctua-shell-terminal = { path = "../ronoctua-shell-terminal" }
ronoctua-shell-transfers = { path = "../ronoctua-shell-transfers" }
ronoctua-shell-update = { path = "../ronoctua-shell-update" }
ronoctua-shell-video-metrics = { path = "../ronoctua-shell-video-metrics" }

ronoctua-tokens = { path = "../ronoctua-tokens" }
ronoctua-render = { path = "../ronoctua-render" }
ronoctua-i18n = { path = "../ronoctua-i18n" }
ronoctua-cmd = { path = "../ronoctua-cmd" }
ronoctua-keymap = { path = "../ronoctua-keymap" }
ronoctua-apps = { path = "../ronoctua-apps" }
ronoctua-store = { path = "../ronoctua-store" }
# WHEN the machine does something to itself: every brain module's action the
# keymap's dump lists (`check-keymap --dump`), and the brain's catalogue the
# start guard reads (`ronoctua_brain::catalogue`).
ronoctua-brain = { path = "../ronoctua-brain" }
# AND THE MODULES' NOTIFICATIONS in it, as the book reads them: the start
# guard and `check-catalogue` ask them before anything draws.
ronoctua-notify = { path = "../ronoctua-notify" }
# THE /private VAULT's status, which the centre's flow reads for the file
# manager's window (`vault_flow.rs`).
ronoctua-private = { path = "../ronoctua-private" }

anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
# WHAT THE FOUNDATION KEEPS FOR TESTS, in these tests too (`test-support`):
# the guards that keep a test off the machine — the clipboard, the
# compositor, the file picker's memory — the stubs a test reads the keymap
# through, and a door built detached. `cfg(test)` is true in a crate's own
# tests only.
ronoctua-shell-kit = { path = "../ronoctua-shell-kit", features = [ "test-support" ] }
ronoctua-shell-door = { path = "../ronoctua-shell-door", features = [ "test-support" ] }
# AND THE PLAYER'S AND ITS PAGES': the binary's tests ask the WHOLE player —
# its view with both pages above it plugged in — what no crate of it can ask
# alone (`player_pages`), over the fixtures they keep for that.
ronoctua-shell-player = { path = "../ronoctua-shell-player", features = [ "test-support" ] }
ronoctua-shell-catalogue = { path = "../ronoctua-shell-catalogue", features = [ "test-support" ] }
ronoctua-shell-video-metrics = { path = "../ronoctua-shell-video-metrics", features = [ "test-support" ] }
# What a test of the keymap reads of the hands' poses.
ronoctua-gestures = { path = "../ronoctua-gestures" }

[lints]
workspace = true

[package.metadata.ronoctua]
# What this crate reads and what its programs are: `nix/rust/units.nix`.
env = ["RONOCTUA_KEYS_DIR"]
