[package]
name = "ronoctua-shell-history"
description = "The shell's history and whether it leaves the machine (`LEADER s h`, Atuin): the view, its two doors — the footer's region and a window — and the one errand handler both carry out."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# THE SHELL HISTORY'S VIEW IN A CRATE OF ITS OWN (the 2026-10-12 wave): its
# view, its window, its region of the footer and its keys, on the kit and the
# door only — so a line of it recompiles it and the binary, and nothing of
# the footer or of any other view.
[dependencies]
ronoctua-shell-kit = { path = "../ronoctua-shell-kit" }
ronoctua-shell-door = { path = "../ronoctua-shell-door" }

ronoctua-tokens = { path = "../ronoctua-tokens" }
ronoctua-render = { path = "../ronoctua-render" }
ronoctua-i18n = { path = "../ronoctua-i18n" }
ronoctua-keymap = { path = "../ronoctua-keymap" }
ronoctua-cmd = { path = "../ronoctua-cmd" }
ronoctua-files = { path = "../ronoctua-files" }
ronoctua-options = { path = "../ronoctua-options" }
# Atuin: its status, its settings and the orders that change them.
ronoctua-atuin = { path = "../ronoctua-atuin" }
# What a finished order says, which the footer says of its own orders too.
ronoctua-shell-history-words = { path = "../ronoctua-shell-history-words" }

smithay-client-toolkit.workspace = true
anyhow.workspace = true
tracing.workspace = true

[dev-dependencies]
# The door's and the kit's guards hold in these tests too (`test-support`).
ronoctua-shell-kit = { path = "../ronoctua-shell-kit", features = [ "test-support" ] }
ronoctua-shell-door = { path = "../ronoctua-shell-door", features = [ "test-support" ] }

[lints]
workspace = true

[package.metadata.ronoctua]
# What this crate reads and what its programs are: `nix/rust/units.nix`.
env = ["RONOCTUA_KEYS_DIR"]
