[package]
name = "ronoctua-websearch"
description = "The one boundary with web search: Wikipedia and DuckDuckGo keyless, the person's SearXNG or Brave key — for fast-access's /w."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# `ronoctua-lookup`'s shape: every source module is PURE without `net` (the
# address, the headers, what the answer means) and `net` adds the transport.
[features]
default = [ "net" ]
net = [ "ronoctua-http/tls", "dep:tracing" ]

[dependencies]
serde.workspace = true
serde_json.workspace = true
# The one log line the net writes: the host and the kind, never the address.
tracing = { workspace = true, optional = true }
# Every search carries a `Pass` for its host; the Brave key is a `Secret` in
# a `0700` folder (`websearch-keys`).
ronoctua-consent = { path = "../ronoctua-consent" }
ronoctua-http = { path = "../ronoctua-http" }
# Where a snippet may be cut: between grapheme clusters, the tree's one rule.
ronoctua-protocol = { path = "../ronoctua-protocol" }

# A test mints its passes from a consent file of its own; the helpers that
# read one are `test-support`, never a product's.
[dev-dependencies]
ronoctua-consent = { path = "../ronoctua-consent", features = [ "test-support" ] }

[lints]
workspace = true
