[package]
name = "ronoctua-packets"
description = "The network protocols' manual as data: each protocol's scene, steps and packets, its drawings and its headers. No Wayland."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# THE PROTOCOLS' MANUAL (`LEADER h`, then the protocols): what each protocol
# is, the network it is shown on, the steps it takes and every packet it
# sends — and the drawings of the devices, the packets' headers bit by bit,
# and the timeline that says where everything is at a moment. A pure crate:
# the window that animates it is `ronoctua-shell-manual`'s
# (`packets_window.rs`), and this one is tested without a screen.
[dependencies]
# The book's keys are `BookKey`s (`nix/text-keys.nix`), and the book is
# opened through it (`ronoctua_i18n::Book`).
ronoctua-i18n = { path = "../ronoctua-i18n" }
# The drawings, rasterised (`art::raster`).
resvg.workspace = true

[lints]
workspace = true

[package.metadata.ronoctua]
# What this crate reads and what its programs are: `nix/rust/units.nix`.
env = ["RONOCTUA_KEYS_DIR"]
# ITS KEYS ARE A BOOK: the manual's pages, read only by the window that opens
# it, never by the start of every program (`nix/text-keys.nix`).
book = "packets"
