[package]
name = "ronoctua-shell-bluetooth"
description = "The radio's view (`LEADER s b`): its rows, its pairing question, its two doors — the footer's region and a window — and the one errand handler both carry out."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# THE RADIO'S VIEW IN A CRATE OF ITS OWN (the 2026-10-12 wave): its view, its
# window, its region of the footer, its words, its camera and its keys, on the
# kit and the door only.
[dependencies]
ronoctua-shell-kit = { path = "../ronoctua-shell-kit" }
ronoctua-shell-door = { path = "../ronoctua-shell-door" }
# The radio as this view and the footer say it — the marks, the pairing
# question, the refusals, the adapter's three orders.
ronoctua-shell-bluetooth-words = { path = "../ronoctua-shell-bluetooth-words" }

ronoctua-tokens = { path = "../ronoctua-tokens" }
ronoctua-render = { path = "../ronoctua-render" }
ronoctua-i18n = { path = "../ronoctua-i18n" }
ronoctua-keymap = { path = "../ronoctua-keymap" }
ronoctua-cmd = { path = "../ronoctua-cmd" }
ronoctua-files = { path = "../ronoctua-files" }
ronoctua-protocol = { path = "../ronoctua-protocol" }
# The ONLY border with BlueZ.
ronoctua-bluetooth = { path = "../ronoctua-bluetooth" }
# A phone's internet, through NetworkManager.
ronoctua-network = { path = "../ronoctua-network" }

smithay-client-toolkit.workspace = true
anyhow.workspace = true
tracing.workspace = true

[dev-dependencies]
# The door's and the kit's guards hold in these tests too (`test-support`).
ronoctua-shell-kit = { path = "../ronoctua-shell-kit", features = [ "test-support" ] }
ronoctua-shell-door = { path = "../ronoctua-shell-door", features = [ "test-support" ] }

[lints]
workspace = true

[package.metadata.ronoctua]
# What this crate reads and what its programs are: `nix/rust/units.nix`.
env = ["RONOCTUA_KEYS_DIR"]
