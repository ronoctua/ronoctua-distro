[package]
name = "ronoctua-runtime"
description = "wasmtime, a buffer's life cycle and the 5 ms budget (sections 5.2 and 7.9)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
# The sixth, and the only one that runs over EVERY buffer: the state contract is
# the same for all of them, and what it proves is the round trip — send the id
# the descriptor declared and get it back out of `state-changed`, through the
# WIT. A buffer that took `enter-state` and did nothing would pass every other
# check and leave the modeline naming a screen that is not up.
name = "ronoctua-test-states"
path = "src/bin/states.rs"

[[bin]]
# It measures instantiation and FAILS above the ceiling. It is a binary, and not a `#[bench]`,
# because the Nix check needs a command that exits non-zero.
name = "ronoctua-bench-instance"
path = "src/bin/bench.rs"

[[bin]]
# It drives the glyph browser the way the host drives it — `event` and `render`
# on the SAME instantiated component — and fails if any of section 6.5's five
# filters stops restricting.
name = "ronoctua-test-browser"
path = "src/bin/browser.rs"

[[bin]]
# The sibling, for the Unicode symbol browser. It asserts what the other does not
# need to assert: that the database survives the `}` inside it, that the combining
# mark appears over the dotted circle AND copies without it, and that the 23
# double-width ones do not come out elided by their own budget.
name = "ronoctua-test-symbols"
path = "src/bin/symbols.rs"

[[bin]]
# The third, for the Lucide icon browser. The criterion only it has: the
# RANGE the icons are drawn in. Lucide's source range collides with
# 634 Nerd Fonts codepoints inside the Iosevka, and the primary face wins the
# fallback — a regression there does not produce tofu, it produces the WRONG icon drawn
# with confidence, which no visual inspection catches.
name = "ronoctua-test-lucide"
path = "src/bin/lucide.rs"

[[bin]]
# The fourth, for the memory panel. The criterion only it has: the screen is
# EMPTY until the host speaks. It is the one driver that pushes a `survey` — a
# record with lists inside, lowered field by field — so a field out of order
# fails here with a message instead of on somebody's screen.
name = "ronoctua-test-memory"
path = "src/bin/memory.rs"

[[bin]]
# THE KEYBOARDS, and the second buffer whose screen is empty until the host
# speaks. What only this proves is what it hands BACK: a remap carries three
# strings, and every one has to be a string the host sent — the host refuses
# anything else, so a buffer that invented one would be a screen where the
# arrows do nothing at all, silently.
name = "ronoctua-test-keyboard"
path = "src/bin/keyboard.rs"

[[bin]]
# The fifth, for the transfer queue in a window. The criterion only it has: the
# cursor is an ID, and the list REORDERS underneath it — a job finishing moves
# every row below it, and the key in question deletes the piece already written
# at the destination. Here the reorder is simulated between the frame and the
# key, which is the one place both sides of the WIT are visible at once.
name = "ronoctua-test-transfers"
path = "src/bin/transfers.rs"

[[bin]]
# The seventh, for the brain's panel. The criterion only it has: it is the
# buffer with NO width constant of its own — the widths are numbers inside four
# `Table`s and half the keys are assembled at run time (`brain-why-{}`), so no
# reading of the source can pair a key with a budget. The FRAME can, and that
# is what this drives.
name = "ronoctua-test-brain"
path = "src/bin/brain.rs"

[[bin]]
# The sixth, for formatting a disk. The criterion only it has: TWO REFUSALS
# that are invisible from the host, because from out there a refusal and a
# crash both look like no plan. A device the running system needs is drawn and
# `Enter` on it goes nowhere; and the first `Enter` on the confirmation screen
# goes BACK, because `no` is the row the cursor starts on.
name = "ronoctua-test-format"
path = "src/bin/format.rs"

[dependencies]
ronoctua-protocol = { path = "../ronoctua-protocol" }
wasmtime.workspace = true
wasmtime-wasi.workspace = true
anyhow.workspace = true
tracing.workspace = true

[lints]
workspace = true
