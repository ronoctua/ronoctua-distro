[package]
name = "ronoctua-http"
description = "HTTP/1.1 by hand: one framer, three transports, a deadline on every read — and the WebSocket that grows out of one."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# THE BASE CRATE STILL HAS NO DEPENDENCY BUT `anyhow`, and that is still the
# point of it. A loopback socket needs a deadline, chunk framing and a body
# that may split a character; it does not need a client.
#
# WHAT THE TWO FEATURES ARE FOR, AND WHY THEY ARE FEATURES
# --------------------------------------------------------
# `ronoctua-tunnel`, `ronoctua-syncthing` and `ronoctua-transfers` talk to
# `127.0.0.1` and to sockets in `/run`. Handing them rustls because ClipCascade
# needs it would put a TLS stack in three crates that will never open one, and
# pay for it on every build of the workspace.
#
# So the transports that cost something are OPTIONAL, and each crate takes the
# one whose problem it actually has:
#
#   tls   the world clock and ClipCascade — another machine, another network
#   ws    ClipCascade only — the one duplex protocol in the tree
#
# All four dependencies were already in the lock underneath the world clock.
# Nothing new enters the closure; what changes is that there is one copy.
#
# `tls` also carries `web` (the redirect rule and gzip): every caller of the
# internet transport walks redirects, so a feature of its own would be a
# switch nobody turns off. `url` parses the addresses the rule resolves (the
# software centre already linked it for that) and `flate2` inflates a gzipped
# body (already in the lock under `png` and `ronoctua-zip`).
#
# `tls` also carries the person's consent: `web::request_let` takes a
# `ronoctua_consent::Pass`, which only that crate mints, so a request to a
# host nobody let is a program that does not compile. The loopback transports
# ask no host and need none.
#
# `tls` also wipes what it sends: a request to another machine is built in
# memory that is zeroed when it is dropped (`zeroize`, already in the lock
# under the consent file, the archives and the PAM door), because a header
# may carry a bearer token or an API key, and a copy left in a long-lived
# process's heap outlives the request (`llm-tokens-never-linger`).
#
# And it keeps what each host agreed (`groups`): the key-exchange group of
# every handshake, in a file of the person's (`ronoctua-store`, serde), bound
# by `tlsGroupsHosts` in `assets/cache.nix` — which is why this crate has a
# build script, and why the script only wants the policy when `tls` is on.

[features]
default = [ ]
tls = [ "dep:rustls", "dep:rustls-pki-types", "dep:rustls-pemfile", "dep:tracing", "dep:url", "dep:flate2", "dep:ronoctua-consent", "dep:zeroize", "dep:ronoctua-store", "dep:serde" ]
# A WebSocket is an HTTP handshake that never ends, so `ws` implies nothing
# about TLS: `ws://` over plain TCP is the same framing as `wss://` over a TLS
# stream, and the frame code is generic over what it writes into.
ws = [ "dep:aws-lc-rs", "dep:base64" ]

[dependencies]
anyhow.workspace = true
tracing = { workspace = true, optional = true }
rustls = { workspace = true, optional = true }
rustls-pki-types = { workspace = true, optional = true }
rustls-pemfile = { workspace = true, optional = true }
url = { version = "2.5", optional = true }
flate2 = { version = "1.1", optional = true }
aws-lc-rs = { workspace = true, optional = true }
base64 = { workspace = true, optional = true }
ronoctua-consent = { path = "../ronoctua-consent", optional = true }
zeroize = { workspace = true, optional = true }
ronoctua-store = { path = "../ronoctua-store", optional = true }
serde = { workspace = true, optional = true }

# A test mints its passes from a consent file of its own; the helpers that
# read one are `test-support`, never a product's.
[dev-dependencies]
ronoctua-consent = { path = "../ronoctua-consent", features = [ "test-support" ] }
# The key the test server signs its handshakes with (`tls-is-post-quantum-first`).
aws-lc-rs = { workspace = true }

[lints]
workspace = true
