[package]
name = "ronoctua-installer"
description = "The installer's questions, what they are checked against, and the installation plan (section 7.1)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "ronoctua-install"
path = "src/bin/install.rs"

[[bin]]
name = "ronoctua-first-boot"
path = "src/bin/first_boot.rs"

# The core — questions, validation and plan — does not depend on the TUI, and it is where
# milestone 8's criteria live. The TUI's `State` does not either: it applies a
# key and does not draw, so `nix flake check` exercises the questions with no
# terminal at all — and the checks that reach the network are jobs a test
# answers itself.
[dependencies]
ronoctua-i18n = { path = "../ronoctua-i18n" }
# The repository's address check, the file it becomes and the names of the
# access files: the belongings' SHAPE only (`prefs`) — `age` and git stay in
# their own CLI, which the installer runs.
ronoctua-belongings = { path = "../ronoctua-belongings", default-features = false, features = [ "prefs" ] }
# The name of our folder under a person's roots, written once.
ronoctua-xdg = { path = "../ronoctua-xdg" }
# The network question's scan, the joining and the gate's reading. The same
# boundary the footer uses: nobody talks to NetworkManager outside this crate.
ronoctua-network = { path = "../ronoctua-network" }
ronoctua-tokens = { path = "../ronoctua-tokens" }
# THE KERNEL'S CONSOLE, where the ISO runs this TUI: its tokens in the
# console's palette slots, shared with the rescue console's.
ronoctua-vt = { path = "../ronoctua-vt" }
# THE PERSON'S REPOSITORY IS MANDATORY (2026-10-05): the consent for its host
# is written into the person's home (`consent.json` is this crate's), the
# names of the person's data are `ronoctua-person`'s (the data alone, no
# applier: that is the extracted binary the plan runs), and the CLI's JSON
# answers are read with serde.
ronoctua-consent = { path = "../ronoctua-consent" }
ronoctua-person = { path = "../ronoctua-person", default-features = false }
# THE PERSON'S BINARY CACHE: the netrc's line and its one path, by the crate
# that knows Cachix — the installer reads a private cache with it, and leaves
# the machine root's copy.
ronoctua-cachix = { path = "../ronoctua-cachix" }
# The netrc's bytes, on their way to the target, in memory that is wiped.
zeroize.workspace = true
serde.workspace = true
serde_json.workspace = true
# THE SWAPFILE IS THE MACHINE'S RAM: read through the one boundary with
# `/proc` (`ronoctua-memory`), whose readings are the protocol's gauges.
ronoctua-memory = { path = "../ronoctua-memory" }
ronoctua-protocol = { path = "../ronoctua-protocol" }
# The deploy key, as a QR code the person's phone reads off the console.
qrcode.workspace = true
anyhow.workspace = true
# `unstable-rendered-line-info`: `Paragraph::line_count`, the rows a text
# takes WRAPPED BY WORDS as it is drawn — counting characters ÷ width
# under-counts, and the last line (a refusal's end, the access's status)
# was cut off the screen.
ratatui = { version = "0.29", default-features = false, features = [
  "crossterm",
  "unstable-rendered-line-info",
] }
crossterm = "0.28"

[lints]
workspace = true

[package.metadata.ronoctua]
# What this crate reads and what its programs are: `nix/rust/units.nix`.
env = ["RONOCTUA_KEYS_DIR", "RONOCTUA_LOCALE_SUPPORTED", "RONOCTUA_MACHINE_DIR", "RONOCTUA_OFFERED_RS", "RONOCTUA_TZ_TAB", "RONOCTUA_XKB_BASE_LST"]
run-env = ["RONOCTUA_LOCALE_SUPPORTED", "RONOCTUA_NIX", "RONOCTUA_TZ_TAB", "RONOCTUA_XKB_BASE_LST"]
