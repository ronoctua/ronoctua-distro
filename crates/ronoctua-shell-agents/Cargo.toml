[package]
name = "ronoctua-shell-agents"
description = "The person's LLM accounts (LEADER m a): the view, its window, its region in the footer, its camera and its keys."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# ONE FEATURE, ONE CRATE (the 2026-10-12 wave): the view, its window, the
# region the footer hosts and the camera stand on the kit and the door alone,
# so a line of the accounts' view recompiles this crate and the binary that
# links it — never the footer, never another view.
[dependencies]
ronoctua-shell-kit = { path = "../ronoctua-shell-kit" }
ronoctua-shell-door = { path = "../ronoctua-shell-door" }

ronoctua-tokens = { path = "../ronoctua-tokens" }
ronoctua-render = { path = "../ronoctua-render" }
ronoctua-keymap = { path = "../ronoctua-keymap" }
ronoctua-cmd = { path = "../ronoctua-cmd" }
ronoctua-i18n = { path = "../ronoctua-i18n" }
ronoctua-files = { path = "../ronoctua-files" }
ronoctua-consent = { path = "../ronoctua-consent" }
# THE PERSON'S LLM ACCOUNTS: the list, each account's plan, limits, usage and
# tokens, read through the one crate that reads the agents' state — on the
# view's threads; and the refresh, asked from a door.
ronoctua-llm = { path = "../ronoctua-llm" }
# THE ACCOUNTS' BRAIN MODULE, whose half the view is: the lines a mark
# changes colour at and the colour of a window — the library's compiled
# manifests and shared half, never a module's code (that is the daemon's).
ronoctua-brain = { path = "../ronoctua-brain" }

smithay-client-toolkit.workspace = true
anyhow.workspace = true
tracing.workspace = true

[dev-dependencies]
# The door's and the kit's guards hold in these tests too (`test-support`).
ronoctua-shell-door = { path = "../ronoctua-shell-door", features = [ "test-support" ] }

[lints]
workspace = true

[package.metadata.ronoctua]
# What this crate reads and what its programs are: `nix/rust/units.nix`.
env = ["RONOCTUA_KEYS_DIR"]
