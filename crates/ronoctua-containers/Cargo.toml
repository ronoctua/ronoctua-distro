[package]
name = "ronoctua-containers"
description = "The one boundary with Podman: its CLI in JSON by the store path — lists, actions, logs, stats, events and inspect of the person's rootless containers."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# THE CLI, NOT THE SOCKET. `podman … --format json` by its store path
# (`RONOCTUA_PODMAN`): the REST API would need chunked streaming and tar bodies
# in `ronoctua-http`, compose is a CLI anyway, and an `exec` belongs in a
# terminal. The rootless socket stays for third-party tools (`DOCKER_HOST`).
[dependencies]
serde.workspace = true
serde_json.workspace = true
# podman's own reason for a refusal goes to the log (`failed`); the screen says
# a closed sentence and sends the person there.
tracing.workspace = true
# `login --password-stdin`: the password is a `Secret`.
ronoctua-consent = { path = "../ronoctua-consent" }

[lints]
workspace = true

[package.metadata.ronoctua]
# What this crate reads and what its programs are: `nix/rust/units.nix`.
