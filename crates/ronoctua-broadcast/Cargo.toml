[package]
name = "ronoctua-broadcast"
description = "World radio (radio-browser), world TV (iptv-org) and the Internet Archive's films: the one crate that talks to the three."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# WHAT THE ONE FEATURE IS FOR
# ---------------------------
# Every module here is PURE without it: the address a question goes to, and
# what the answer means. They talk to a `Net`, and a test hands one made of
# answers. `net` adds the one `Net` that reaches a host (`internet`), and with
# it the TLS stack.
#
# The daemon takes it. A door (the shell) takes the crate with
# `default-features = false` for the table of categories, the types it draws
# and the favourites it writes — and links no TLS for them.
#
# WHAT THE SPLIT DOES NOT DO YET: `nix/rust.nix` builds the whole
# workspace in ONE cargo run, and features unify across it. This crate is a
# member built with its default, so every binary of that run that links it
# links the TLS stack as well — and the shell already links TLS through
# `ronoctua-software/net`. What the split keeps is a crate that COMPILES
# without `net`; `cargo clippy -p ronoctua-broadcast --no-default-features` is what
# proves it, by hand, until a check does.
#
# NO THREAD, NO CLOCK: every fetch blocks its caller, and the caller is a
# worker thread of the daemon. Time arrives as an argument.
#
# AND THE CATALOGUE: `catalog` brings `rusqlite` over the system's
# `libsqlite3` (never `bundled`: no C of our own; FTS5 is the store's) for
# `catalog::Writer` and `catalog::Reader`. The daemon takes it by default; a
# door that reads the catalogue asks for it by name (`default-features =
# false, features = ["catalog"]`) and links SQLite without TLS. Without it,
# the catalogue's types, its folding and every source's reader still compile:
# only the files are behind it. This crate and `ronoctua-video-metrics` are
# the only two that name `rusqlite` (`one-sqlite-boundary`).
#
# The new default sources (NASA, Commons, PeerTube) ask only behind `net`,
# and only with the person's `ronoctua_consent::Pass` for the host.

[features]
default = [ "net", "catalog" ]
net = [ "ronoctua-http/tls", "dep:tracing" ]
catalog = [ "dep:rusqlite" ]

[dependencies]
serde.workspace = true
serde_json.workspace = true
tracing = { workspace = true, optional = true }
# The framer, for `Reply` (no dependency but `anyhow` without `tls`), and
# `web` (redirects, gzip) with it.
ronoctua-http = { path = "../ronoctua-http" }
# Where the cache and the favourites live, per instance.
ronoctua-xdg = { path = "../ronoctua-xdg" }
# The favourites and the recently played: one file each, written whole and
# atomically, read back with `parsed` before a write.
ronoctua-store = { path = "../ronoctua-store" }
# `Stream` and `Origin`: what a station, a channel or an archive file becomes
# in the queue. Pure (an XML reader and serde). Its M3U reader keeps the IPTV
# attributes a person's list is read by.
ronoctua-playlist = { path = "../ronoctua-playlist" }
# The person's consent (`Pass`) for a default source's host, and the private
# file `sources.json` is written through (`keys::write_private_file`).
ronoctua-consent = { path = "../ronoctua-consent" }
# A feed is XML from outside: through the depth guard.
ronoctua-xml = { path = "../ronoctua-xml" }
# A person's YouTube channel or playlist, listed flat (`flat_up_to`).
ronoctua-ytdlp = { path = "../ronoctua-ytdlp" }
# NFD, to take a title's accents off for its sort key and its letter. Already
# in every program through `url`'s IDNA; the compiled data only.
icu_normalizer = { version = "2.2", default-features = false, features = [ "compiled_data" ] }
# The serialised `sources.json` is wiped once written.
zeroize.workspace = true
# The host a consent pass is checked against, and the one a masked address
# shows, read by the parser the web fetches with (the WHATWG rules): a looser
# split names another host than the request goes to. Already in every
# program that links `ronoctua-http/tls`.
url = "2.5"
# THE CATALOGUE'S FILES (feature `catalog`).
rusqlite = { workspace = true, optional = true }

# A test mints its passes from a consent file of its own; the helpers that
# read one are `test-support`, never a product's.
[dev-dependencies]
ronoctua-consent = { path = "../ronoctua-consent", features = [ "test-support" ] }

[lints]
workspace = true
