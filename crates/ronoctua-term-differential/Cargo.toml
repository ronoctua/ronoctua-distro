[package]
name = "ronoctua-term-differential"
description = "The terminal engine's differential test: libghostty-vt against alacritty_terminal over one VT corpus, in a canonical grid, with the reference colours both are handed."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# A CRATE OF ITS OWN, AND ITS PROGRAM A DRIVER. Everything here exists only to
# ask two engines the same question: the second engine (alacritty), the
# canonical grid both answer in, and a colour table written by hand. Inside
# `ronoctua-term` they sat behind a feature, one `--features` away from every
# program that links the engine; here nothing a machine runs depends on them,
# and `every-bin-has-a-role` holds the program to that.
[[bin]]
# The criterion of section 7.10: zero diff across the engines, each engine on
# its own goldens, and the mirror on the holder at every byte of the corpus
# (`tests/checks.nix`, `term-differential`).
name = "ronoctua-term-diff"
path = "src/bin/differential.rs"

[dependencies]
# The second opinion: an independently written reading of the same bytes.
alacritty_terminal.workspace = true
anyhow.workspace = true
# The product engine, asked through its own safe API: `Vt::written` for a
# cell, the snapshot and the mirror for the every-cut verdict.
ronoctua-term = { path = "../ronoctua-term" }

[lints]
workspace = true

[package.metadata.ronoctua]
# What this crate reads and what its programs are: `nix/rust/units.nix`.
bins = { "ronoctua-term-diff" = "driver" }
