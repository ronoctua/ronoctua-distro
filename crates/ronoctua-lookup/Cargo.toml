[package]
name = "ronoctua-lookup"
description = "The player's online lookups: lyrics, skipped segments, tags, covers, films and subtitles — and the person's keys."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# WHAT THE ONE FEATURE IS FOR
# ---------------------------
# Every service module here is PURE without it: the address a question goes
# to, the headers it carries, and what the answer means. They talk to a
# `Net`, and a test hands one made of answers. `net` adds the one `Net` that
# reaches a host (`internet`), and with it the TLS stack.
#
# The daemon takes it; a door that only writes a key the person pasted
# (`keys`) or names a host beside a consent (`Host`) takes the crate with
# `default-features = false`, and links no TLS for it.
#
# WHAT THE SPLIT DOES NOT DO YET: `nix/rust.nix` builds the whole
# workspace in ONE cargo run, and features unify across it. This crate is a
# member built with its default, so every binary of that run that links it
# links the TLS stack as well — and the shell already links TLS through
# `ronoctua-software/net`. What the split keeps is a crate that COMPILES
# without `net`; `cargo clippy -p ronoctua-lookup --no-default-features` is what
# proves it, by hand, until a check does.

[features]
default = [ "net" ]
net = [ "ronoctua-http/tls", "dep:tracing" ]

[dependencies]
serde.workspace = true
serde_json.workspace = true
tracing = { workspace = true, optional = true }
# The framer, for `Reply` (no dependency but `anyhow` without `tls`), and
# `web` (redirects, gzip) with it.
ronoctua-http = { path = "../ronoctua-http" }
# Where the keys live: `$XDG_CONFIG_HOME/ronoctua/player-keys/`, per instance.
ronoctua-xdg = { path = "../ronoctua-xdg" }
# SubDL (and Podnapisi) answer a zip.
ronoctua-zip = { path = "../ronoctua-zip" }
# `Field`: a suggestion names the same fields a sheet has, so taking one is
# writing those fields. Schema only.
ronoctua-tags = { path = "../ronoctua-tags", default-features = false }

[lints]
workspace = true
