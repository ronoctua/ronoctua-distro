[package]
name = "ronoctua-shell-icons"
description = "The icons app (`LEADER m i`): its grid and page of glyphs, figures and characters, its window and its footer region."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# THE ICONS APP (the 2026-10-12 wave): the view both doors draw, its window,
# its camera, its region of the footer and the one errand handler the two
# share. On the kit and the door only.
[dependencies]
ronoctua-shell-kit = { path = "../ronoctua-shell-kit" }
ronoctua-shell-door = { path = "../ronoctua-shell-door" }

ronoctua-tokens = { path = "../ronoctua-tokens" }
ronoctua-render = { path = "../ronoctua-render" }
ronoctua-design = { path = "../ronoctua-design" }
# The three tables: the Nerd Fonts glyphs, the Lucide figures, Unicode.
ronoctua-iconset = { path = "../ronoctua-iconset" }
# A figure's SVG, rasterised at its natural size.
ronoctua-notify = { path = "../ronoctua-notify" }
ronoctua-cmd = { path = "../ronoctua-cmd" }
ronoctua-keymap = { path = "../ronoctua-keymap" }
ronoctua-i18n = { path = "../ronoctua-i18n" }

smithay-client-toolkit.workspace = true
anyhow.workspace = true
tracing.workspace = true

[dev-dependencies]
# The door's and the kit's guards hold in these tests too (`test-support`).
ronoctua-shell-door = { path = "../ronoctua-shell-door", features = [ "test-support" ] }

[lints]
workspace = true

[package.metadata.ronoctua]
# What this crate reads and what its programs are: `nix/rust/units.nix`.
env = ["RONOCTUA_KEYS_DIR"]
