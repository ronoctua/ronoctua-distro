[package]
name = "ronoctua-keyboards"
description = "The one boundary with the keyboards: which ones the kernel sees, what each one remaps, and the file keyd reads."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
anyhow = { workspace = true }
ronoctua-store = { path = "../ronoctua-store" }
serde = { workspace = true }
tracing = { workspace = true }

[lints]
workspace = true

[package.metadata.ronoctua]
# What this crate reads and what its programs are: `nix/rust/units.nix`.
env = ["RONOCTUA_KEYBOARDS_RS", "RONOCTUA_KEYD"]
run-env-absent = ["RONOCTUA_XKB_LIST"]
