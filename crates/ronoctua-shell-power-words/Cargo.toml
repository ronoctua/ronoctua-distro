[package]
name = "ronoctua-shell-power-words"
description = "The power daemons as the shell says them: a refusal, which command a lock is, how long the battery has, the profile's glyph and the modeline's battery segment."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# THE POWER DAEMONS' WORDS AND MARKS (the 2026-10-12 wave): the footer says
# them with no view open — a refusal of the orders its own thread carries,
# the alarms' daemon word, the modeline's mark and the sentence under the
# pointer over it — and the power view says them in both of its doors, so
# they stand under both, and on no other shell crate. A leaf of its own, and
# not a module of the kit: under the kit, a line of the power crate would
# recompile every shell crate; here, it recompiles this, the power view and
# the binary.
[dependencies]
ronoctua-i18n = { path = "../ronoctua-i18n" }
ronoctua-tokens = { path = "../ronoctua-tokens" }
ronoctua-power = { path = "../ronoctua-power" }
# The refusal also goes to the log, with the daemon's own words.
tracing.workspace = true

[dev-dependencies]
# The width a segment is drawn at, which its tests measure.
ronoctua-render = { path = "../ronoctua-render" }

[lints]
workspace = true

[package.metadata.ronoctua]
# What this crate reads and what its programs are: `nix/rust/units.nix`.
env = ["RONOCTUA_KEYS_DIR"]
