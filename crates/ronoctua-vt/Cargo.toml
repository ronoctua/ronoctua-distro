[package]
name = "ronoctua-vt"
description = "The kernel's console: a terminal UI's tokens in its sixteen palette slots."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# THE TWO TERMINAL UIS' SHARED HALF, and nothing else: the installer (the
# ISO's console) and the rescue console (VT 8) both draw with ratatui, and
# both run where the kernel keeps about one bit of a 24-bit colour. Neither
# depends on the other, and this is what they both stand on — the same
# ratatui, with no backend, so it costs neither a new store path.
[dependencies]
ronoctua-tokens = { path = "../ronoctua-tokens" }
ratatui = { version = "0.29", default-features = false }

[lints]
workspace = true

[package.metadata.ronoctua]
# What this crate reads and what its programs are: `nix/rust/units.nix`.
