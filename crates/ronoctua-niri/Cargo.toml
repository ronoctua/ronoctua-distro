[package]
name = "ronoctua-niri"
description = "Unica fronteira com o IPC do niri. Folha do grafo: so o shell a toca."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# Dependencies deliberately MINIMAL.
#
# Node `niri-ipc`: pinning the types to a published version would make the
# contract test against `niri-next` vacuous — see the comment at the top of
# `src/lib.rs`. And no async runtime: the event stream is one JSON line
# at a time over a unix socket, and a thread with a blocking `read_line` handles it
# without dragging a whole executor into the shell.
[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true

[lints]
workspace = true
