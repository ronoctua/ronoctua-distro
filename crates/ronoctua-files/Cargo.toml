[package]
name = "ronoctua-files"
description = "The one boundary with the file system: listing, explaining and acting."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# The same shape as `ronoctua-memory` and `ronoctua-network`: one border, one
# crate. The parsers are pure — a `&str` goes in, a value comes out — and every
# root is a parameter, so a fake tree in a test is worth more than a virtual
# machine one has to boot.
[dependencies]
# The two XDG roots, in the one crate that owns them (zero dependencies).
ronoctua-xdg = { path = "../ronoctua-xdg" }
# `ronoctua-apps` for two things it already knows: `fold` (accents off, so that
# sorting puts `Ágil` where a person looks for it) and `DesktopEntry`, which is
# what answers "who opens this file". Resolving that here keeps the shell from
# learning the `.desktop` format a second time.
ronoctua-apps = { path = "../ronoctua-apps" }
ronoctua-i18n = { path = "../ronoctua-i18n" }
ronoctua-tokens = { path = "../ronoctua-tokens" }
# AN ARCHIVE, WALKED INTO LIKE A FOLDER: its members, as `ronoctua-archive`
# lists them, become rows (`archive.rs`). The programs are that crate's, run
# by the shell's threads — nothing here starts one.
ronoctua-archive = { path = "../ronoctua-archive" }
anyhow.workspace = true
tracing.workspace = true
# `chown`, `getgroups` and `statfs`. `rustix` and not `libc` for the reason the
# workspace already gives: the API is safe, and this crate forbids `unsafe`.
#
# `event` is for `poll`, which is how ONE thread waits on the inotify descriptor
# and the shutdown pipe at once (`notice`). It has to be named HERE even though
# `ronoctua-shell` already enables it: with `resolver = "3"` features do not
# unify across a `-p` build, so without this line `cargo test -p ronoctua-files`
# — the loop this repository tells its agents to iterate in — does not compile.
# No new crate in the lock and no new store reference: `inotify` and `poll` are
# syscalls.
rustix = { workspace = true, features = [ "fs", "process", "event" ] }
# THE SIDEBAR'S FILE, and this crate builds a ROOT BINARY, so the line deserves
# a word. `serde` is code and not a store reference, so neither
# `files-runs-by-path` nor the `${../.}` trap `AGENTS.md` records is affected —
# `ronoctua-files-root` gets a few kilobytes and no new closure.
#
# `ronoctua-disks` is the dependency that was refused for exactly that reason.
# The sidebar draws devices, but what it MODELS here is only what a person
# configured — a folder, a file, an application, the trash. A device is
# discovered, not configured, and pulling that crate in would put zbus and a
# D-Bus connection inside a binary that runs as root, and would give this crate
# a second border. The host owns both and splices them; see `sidebar::Sidebar`.
serde = { workspace = true, features = [ "derive" ] }
serde_json.workspace = true

# THE PRIVILEGED HELPER, as its own binary.
#
# A `[[bin]]` and not part of the shell, so `nix/rust.nix` can extract JUST this
# — the trap `AGENTS.md` records: a derivation references what its BYTES cite,
# and shipping the whole workspace to run four syscalls as root would put the
# renderer, wgpu and the wasm runtime in a unit that runs as root.
[[bin]]
name = "ronoctua-files-root"
path = "src/bin/root.rs"

# AND THE ONE THAT EMPTIES THE TRASH, extracted for the same reason: what
# deletes the only copy of somebody's file must not have the whole shell in its
# closure. It is here and not beside the cache sweep because this crate owns the
# freedesktop trash layout — a second reader of `.trashinfo` would be a second
# thing to keep in step with the spec.
[[bin]]
name = "ronoctua-empty-trash"
path = "src/bin/empty-trash.rs"

[lints]
workspace = true
