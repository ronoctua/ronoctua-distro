[package]
name = "ronoctua-shell-syncthing-words"
description = "Syncthing as the shell says it: the sentence for each refusal of an order, in the Syncthing view's doors and the footer's own orders."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# SYNCTHING'S REFUSALS IN WORDS (the 2026-10-12 wave): the footer says them of
# its own orders with no view open (pause every folder, resume them) and the
# Syncthing view in both of its doors, so they stand under both — and on no
# other shell crate. A leaf of its own, and not a module of the kit, because
# the Syncthing crate is a boundary whose library changes with its REST API
# (and bakes in the table of `assets/syncthing-options.nix`): under the kit, a
# line of it would recompile every shell crate; here, it recompiles this, the
# Syncthing view and the binary.
[dependencies]
ronoctua-i18n = { path = "../ronoctua-i18n" }
ronoctua-syncthing = { path = "../ronoctua-syncthing" }

[lints]
workspace = true

[package.metadata.ronoctua]
# What this crate reads and what its programs are: `nix/rust/units.nix`.
env = ["RONOCTUA_KEYS_DIR"]
