[package]
name = "ronoctua-shell-terminal"
description = "A terminal in an xdg_toplevel of its own: the shell's terminal, the monitor and the rescue console."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# THE TERMINAL WINDOW (the 2026-10-12 wave): the Wayland half of
# `ronoctua-term`'s engine — one window, three identities (the terminal, the
# monitor, the rescue console). On the kit and the door only.
[dependencies]
ronoctua-shell-kit = { path = "../ronoctua-shell-kit" }
ronoctua-shell-door = { path = "../ronoctua-shell-door" }

ronoctua-tokens = { path = "../ronoctua-tokens" }
ronoctua-i18n = { path = "../ronoctua-i18n" }
ronoctua-protocol = { path = "../ronoctua-protocol" }
ronoctua-term = { path = "../ronoctua-term" }

smithay-client-toolkit.workspace = true
anyhow.workspace = true
tracing.workspace = true

[dev-dependencies]
# The door's and the kit's guards hold in these tests too (`test-support`).
ronoctua-shell-door = { path = "../ronoctua-shell-door", features = [ "test-support" ] }

[lints]
workspace = true

[package.metadata.ronoctua]
# What this crate reads and what its programs are: `nix/rust/units.nix`.
