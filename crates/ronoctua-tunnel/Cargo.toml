[package]
name = "ronoctua-tunnel"
description = "The one boundary with Tailscale's local API and Tor's control socket: the two tunnels the network view knows."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# NO `[[bin]]`: nothing here is a daemon. The footer and the window raise the
# thread, the same way they do for the radio and the batteries.

[dependencies]
# THE SHARED ARITHMETIC OF A DECLARED SETTING — which word a ring turns to,
# what step a number takes, what text key a word has. Four tables in this tree
# come out of one generator, and without this they would be four copies of the
# same fifty lines.
ronoctua-options = { path = "../ronoctua-options" }
# THE ONE TOR DECISION THAT IS OURS — whether it comes up with the session.
# `systemctl enable` would need a third verb in the polkit rule, and the
# check refuses one; see `src/prefs.rs`.
ronoctua-store = { path = "../ronoctua-store" }
anyhow.workspace = true
# THE FRAMER IS NOT OURS ANY MORE. It was written here for Tailscale, and its
# own first line said it was the shape `shell::syncthing` already had; the
# Syncthing view would have made a third copy. One crate, two transports.
ronoctua-http = { path = "../ronoctua-http" }
# The watching thread outlives whoever asked for it, and when a daemon goes
# away there is nobody to return an error to — so it says so to the log.
tracing.workspace = true
# Tailscale's local API answers JSON, and it is NOT a stable interface: every
# field is read with `#[serde(default)]` so that a release adding, removing or
# renaming one takes a fact off the screen instead of emptying it.
serde = { workspace = true }
serde_json.workspace = true

[lints]
workspace = true
