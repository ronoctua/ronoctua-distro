[package]
name = "ronoctua-tokens"
description = "The design system's tokens, generated from Nix. Zero dependencies."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# ZERO DEPENDENCIES, on purpose (section 10): this crate is a dependency of
# everything else, including of those that compile to wasm32-wasip2. Any
# dependency here becomes a dependency of everything.
[dependencies]

[lints]
workspace = true

[package.metadata.ronoctua]
# What this crate reads and what its programs are: `nix/rust/units.nix`.
env = ["RONOCTUA_TOKENS_RS"]
run-env = ["RONOCTUA_THEMES"]
